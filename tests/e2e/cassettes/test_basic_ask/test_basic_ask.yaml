      Models\")\n   1. [Longer Context \u2260\\neq Higher Serving Cost.](https://arxiv.org/html/2510.04618v1#S5.SS0.SSS0.Px1
      \"In 5 Discussion \u2023 Agentic Context Engineering: Evolving Contexts for
      Self-Improving Language Models\")\n   2. [Implications for Online and Continuous
      Learning.](https://arxiv.org/html/2510.04618v1#S5.SS0.SSS0.Px2 \"In 5 Discussion
      \u2023 Agentic Context Engineering: Evolving Contexts for Self-Improving Language
      Models\")\n7. [A Related Work on Agent Memory](https://arxiv.org/html/2510.04618v1#A1
      \"In Agentic Context Engineering: Evolving Contexts for Self-Improving Language
      Models\")", "72f6d5fe65e5441f97e52e19216460c3/u/link/9394-11763": "## 1 Introduction\n\nReport
      issue for preceding element\nImage Refer to caption\n\nFigure 1: Overall Performance
      Results. Our proposed framework, ACE, consistently outperforms strong baselines
      across agent and domain-specific reasoning tasks.\n\nReport issue for preceding
      element\n\nModern AI applications based on large language models (LLMs), such
      as LLM agents [[52](https://arxiv.org/html/2510.04618v1#bib.bib52), [49](https://arxiv.org/html/2510.04618v1#bib.bib49)]
      and compound AI systems [[55](https://arxiv.org/html/2510.04618v1#bib.bib55)],
      increasingly depend on context adaptation.\nInstead of modifying model weights,
      context adaptation improves performance after model training by incorporating
      clarified instructions, structured reasoning steps, or domain-specific input
      formats directly into the model\u2019s inputs.\nContexts underpin many AI system
      components, including system prompts that guide downstream tasks [[36](https://arxiv.org/html/2510.04618v1#bib.bib36),
      [4](https://arxiv.org/html/2510.04618v1#bib.bib4)], memory that carries past
      facts and experiences [[41](https://arxiv.org/html/2510.04618v1#bib.bib41),
      [48](https://arxiv.org/html/2510.04618v1#bib.bib48)], and factual evidence that
      reduces hallucination and supplements knowledge [[6](https://arxiv.org/html/2510.04618v1#bib.bib6)].\n\nReport
      issue for preceding element\n\nAdapting through contexts rather than weights
      offers several key advantages.\nContexts are interpretable and explainable for
      users and developers [[47](https://arxiv.org/html/2510.04618v1#bib.bib47), [45](https://arxiv.org/html/2510.04618v1#bib.bib45)],
      allow rapid integration of new knowledge at runtime [[27](https://arxiv.org/html/2510.04618v1#bib.bib27),
      [7](https://arxiv.org/html/2510.04618v1#bib.bib7)], and can be shared across
      models or modules in a compound system [[23](https://arxiv.org/html/2510.04618v1#bib.bib23)].\nMeanwhile,
      advances in long-context LLMs [[39](https://arxiv.org/html/2510.04618v1#bib.bib39)]
      and context-efficient inference such as KV cache reuse [[17](https://arxiv.org/html/2510.04618v1#bib.bib17),
      [51](https://arxiv.org/html/2510.04618v1#bib.bib51)] are making context-based
      approaches increasingly practical for deployment.\nAs a result, context adaptation
      is emerging as a central paradigm for building capable, scalable, and self-improving
      AI systems.\n\nReport issue for preceding element"}, "query_context_order":
