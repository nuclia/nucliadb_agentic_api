      [30]\u2191", "72f6d5fe65e5441f97e52e19216460c3/u/link/25767-28383": "### 3.1
      Incremental Delta Updates\n\nReport issue for preceding element\n\nA core design
      principle of ACE is to represent context as a collection of *structured, itemized
      bullets*, rather than a single monolithic prompt.\nThe concept of a bullet is
      similar to the concept of a memory entry in LLM memory frameworks like Dynamic
      Cheatsheet [[41](https://arxiv.org/html/2510.04618v1#bib.bib41)] and A-MEM [[48](https://arxiv.org/html/2510.04618v1#bib.bib48)],
      but builds on top of that and consists of (1) metadata, including a unique identifier
      and counters tracking how often it was marked helpful or harmful; and (2) content,
      capturing a small unit such as a reusable strategy, domain concept, or common
      failure mode.\nWhen solving new problems, the Generator highlights which bullets
      were useful or misleading, providing feedback that guides the Reflector in proposing
      corrective updates.\n\nReport issue for preceding element\n\nThis itemized design
      enables three key properties:\n(1) *localization*, so only the relevant bullets
      are updated;\n(2) *fine-grained retrieval*, so the Generator can focus on the
      most pertinent knowledge; and\n(3) *incremental adaptation*, allowing efficient
      merging, pruning, and de-duplication during inference.\n\nReport issue for preceding
      element\n\nRather than regenerating contexts in full, ACE incrementally produces
      compact *delta contexts*: small sets of candidate bullets distilled by the Reflector
      and integrated by the Curator.\nThis avoids the computational cost and latency
      of full rewrites, while ensuring that past knowledge is preserved and new insights
      are steadily appended.\nAs contexts grow, this approach provides the scalability
      needed for long-horizon or domain-intensive applications.\n\nReport issue for
      preceding element\n\n### 3.2 Grow-and-Refine\n\nReport issue for preceding element\n\nBeyond
      incremental growth, ACE ensures that contexts remain compact and relevant through
      periodic or lazy refinement.\nIn grow-and-refine, bullets with new identifiers
      are appended, while existing bullets are updated in place (e.g., incrementing
      counters).\nA de-duplication step then prunes redundancy by comparing bullets
      via semantic embeddings.\nThis refinement can be performed proactively (after
      each delta) or lazily (only when the context window is exceeded), depending
      on application requirements for latency and accuracy.\n\nReport issue for preceding
      element\n\nTogether, incremental updates and grow-and-refine maintain contexts
      that expand adaptively, remain interpretable, and avoid the potential variance
      introduced by monolithic context rewriting.\n\nReport issue for preceding element",
