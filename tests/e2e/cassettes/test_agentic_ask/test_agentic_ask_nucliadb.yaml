- request:
    body: '{"question": "What are the notable accomplishments of Debbie Reynolds?",
      "user_id": "8172a9d6e93f405db6de195c9a2e4103", "retrieval": true, "system":
      null, "query_context": {"f03cab2815f148c584c66bdaa5e595cf/t/text/0-228": "Mary
      Frances Debbie Reynolds (April 1, 1932 \u2013 December 28, 2016) was an American
      actress, singer and entrepreneur. Her acting career spanned almost 70 years.
      Reynolds performed on stage and television and in films into her 80s.", "adce3e560e664fbe90f53bfe49a5b496/t/text/0-653":
      "Her television series The Debbie Reynolds Show earned her a Golden Globe nomination
      in 1969. She starred in the 1973 Broadway revival of the musical Irene, which
      earned her a Tony Award nomination for Best Leading Actress in a Musical. She
      was also nominated for a Daytime Emmy Award for her performance in A Gift of
      Love (1999). After appearing in the popular early-2000s sitcom Will & Grace,
      Reynolds was nominated for a Primetime Emmy Award for Outstanding Guest Actress
      in a Comedy Series for her role as Bobbi, the mother of Grace Adler. Reynolds
      would reach a new, younger audience with her role as Aggie Cromwell in Disney''s
      Halloweentown series.", "49382e7207434a7087f6d0766a616193/t/text/0-763": "Fisher
      was the daughter of singer Eddie Fisher and actress Debbie Reynolds. She and
      her mother appear together in Bright Lights: Starring Carrie Fisher and Debbie
      Reynolds, a documentary about their relationship. It premiered at the 2016 Cannes
      Film Festival. She earned praise for speaking publicly about her experiences
      with bipolar disorder and drug addiction.[10] Fisher died of a sudden cardiac
      arrest in December 2016, at age 60, four days after experiencing a medical emergency
      during a transatlantic flight from London to Los Angeles. She was posthumously
      made a Disney Legend in 2017,[11] and was awarded a posthumous Grammy Award
      for Best Spoken Word Album the following year. In 2023, she posthumously received
      a star on the Hollywood Walk of Fame.[12]", "9b50cca7d8f6451aa4b11f8279e85af9/t/text/0-591":
      "Reynolds was a longtime ally of the LGBT community and an early advocate for
      people with AIDS.[67] In 1983, Reynolds performed at an AIDS fundraiser with
      her friend Shirley MacLaine.[68] In a 2014 interview with The Daily Telegraph,
      Reynolds revealed that she had helped several closeted actors conceal their
      homosexuality by dating them.[69] When asked when she realized she was a gay
      icon, Reynolds replied, Over the years many of the boys that have worked for
      me as dancers have been gay. The creative people were all gay people, from producers
      to writers. To me, they were just family. [", "12bd490d2e0e4f3e97bbc75e9df9beb1/t/text/0-736":
      "Her starring role in The Unsinkable Molly Brown (1964) led to a nomination
      for the Academy Award for Best Actress.[22] Reynolds noted that she initially
      had issues with its director, Charles Walters. He didn''t want me, she said.
      He wanted Shirley MacLaine, who at the time was unable to take the role. He
      said, ''You are totally wrong for the part.'' But six weeks into production,
      he reversed his opinion. He came to me and said, ''I have to admit that I was
      wrong. You are playing the role really well. I''m pleased.'' [23] Reynolds also
      played in Goodbye Charlie, a 1964 comedy film about a callous womanizer who
      gets his just reward. It was adapted from George Axelrod''s play Goodbye, Charlie
      and also starred Tony Curtis and Pat Boone.", "7198cc70a29f4d9c91c231b205e28bcd/t/text/0-581":
      "Mary Frances Reynolds was born on April 1, 1932, in El Paso, Texas, to Maxene
      N. Minnie Harman and Raymond Francis Ray Reynolds, a carpenter who worked for
      the Southern Pacific Railroad.[citation needed] She was of Scottish-Irish and
      English ancestry[9] and was raised in a strict Nazarene church of her domineering
      mother.[10] She had an older brother, William, who was two years her senior.[11]
      Reynolds was a Girl Scout, once saying that she wanted to die as the world''s
      oldest living Girl Scout.[12] Reynolds was also a member of The International
      Order of Job''s Daughters.[13]", "c610a89b43a448bd9f2a00ab7333bd3c/t/text/0-512":
      "Reynolds was married three times. Her first marriage was to singer and actor
      Eddie Fisher in 1955.[71] They became the parents of Carrie Fisher and Todd
      Fisher. The couple divorced in 1959 when it was revealed shortly after the death
      of Elizabeth Taylor''s husband Mike Todd that Fisher had been having an affair
      with her; Taylor and Reynolds were good friends at the time. The Eddie Fisher
      \u2013 Elizabeth Taylor affair was a great public scandal, which led to the
      cancellation of Eddie Fisher''s television show.[72]", "bbf12fa5604f4da98f128fc3fd58d97d/t/text/0-450":
      "Singin'' in the Rain is a 1952 American musical romantic comedy film directed
      and choreographed by Gene Kelly and Stanley Donen, starring Kelly, Donald O''Connor
      and Debbie Reynolds, with Jean Hagen, Millard Mitchell, Douglas Fowley, Rita
      Moreno and Cyd Charisse in supporting roles. It offers a lighthearted depiction
      of Hollywood in the late 1920s, with the three stars portraying performers caught
      up in the transition from silent films to talkies .", "d04233be4a974271bc947424972cbdba/t/text/0-394":
      "On December 28, 2016, Reynolds was taken by ambulance to Cedars-Sinai Medical
      Center in Los Angeles, after suffering a severe stroke, according to her son.[80]
      Later that afternoon, Reynolds was pronounced dead in the hospital; she was
      84 years old.[81][82][83] On January 9, 2017, her cause of death was determined
      to be an intracerebral hemorrhage, with hypertension a contributing factor.[84",
      "060abac9fd8f48d0b4f2c310e9840f7a/t/text/0-495": "After Comden and Green had
      returned to New York to work on other projects, they received word that a new
      song was needed for a love-song sequence between Kelly and Debbie Reynolds.
      The original had been a song-and-dance medley involving different sets in different
      soundstages on the studio lot, but they were asked for a romantic love song
      set in an empty sound stage, and it was needed immediately. Comden and Green
      provided such a scene for You Were Meant for Me and sent it off to Hollywood.",
      "56f11f6ec7f44ff8bc1c4211852fc29e/t/text/0-615": "Todd Fisher later said that
      Reynolds had been seriously affected by her daughter''s death, and that her
      grief partially contributed to her stroke, noting that his mother had stated,
      I want to be with Carrie, shortly before she died.[86][87][88] During an interview
      for the December 30, 2016, airing of the ABC-TV program 20/20, Todd Fisher elaborated
      on this, saying that his mother had joined his sister in death because Reynolds
      didn''t want to leave Carrie and did not want her to be alone. [89] He added,
      she didn''t die of a broken heart as some news reports had implied, but rather
