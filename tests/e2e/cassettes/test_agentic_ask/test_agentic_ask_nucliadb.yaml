f/2081015753104886b2536c3ef8ad1f92/973-1220":1.6571451851632446e-05,"f64d6dd68c4d4b27962e0636b76cf7d3/f/3c473649f9044f03aa6c06e0b6da43da/979-1227":1.6442494597868063e-05,"c8ba7316fbd74fea98cb39c282881f67/f/05e897bfb9914f3e8056ddc521ac6df5/1799-2084":1.6442494597868063e-05,"c8ba7316fbd74fea98cb39c282881f67/f/05e897bfb9914f3e8056ddc521ac6df5/1529-1799":1.6442494597868063e-05,"c8ba7316fbd74fea98cb39c282881f67/f/05e897bfb9914f3e8056ddc521ac6df5/1252-1529":1.6442494597868063e-05,"8387464bca6f408fbfdbca79a1bc72bb/f/589d7f53b72c45758f94a90bd16e3211/535-841":1.6442494597868063e-05,"99ac6d905f5c4585997cacabe7ea8639/f/38ea6718a3fb435088446379ec381f08/794-1051":1.6314539607265033e-05,"8387464bca6f408fbfdbca79a1bc72bb/f/589d7f53b72c45758f94a90bd16e3211/841-1120":1.6314539607265033e-05,"c8ba7316fbd74fea98cb39c282881f67/f/05e897bfb9914f3e8056ddc521ac6df5/2084-2356":1.6187581422855146e-05,"c5c8c22970d6458c8ed170d386da2688/f/d85166150123490ab51da42681f71e19/757-958":1.6187581422855146e-05,"f64d6dd68c4d4b27962e0636b76cf7d3/f/3c473649f9044f03aa6c06e0b6da43da/1455-1678":1.6061610949691385e-05,"8387464bca6f408fbfdbca79a1bc72bb/f/589d7f53b72c45758f94a90bd16e3211/1120-1338":1.6061610949691385e-05}}'
