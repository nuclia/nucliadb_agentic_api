    body: '{"question": "What is Debbie Reynolds known for?", "user_id": "", "context":
      {"f03cab2815f148c584c66bdaa5e595cf/t/text/0-228": "Mary Frances Debbie Reynolds
      (April 1, 1932 \u2013 December 28, 2016) was an American actress, singer and
      entrepreneur. Her acting career spanned almost 70 years. Reynolds performed
      on stage and television and in films into her 80s. ", "adce3e560e664fbe90f53bfe49a5b496/t/text/0-653":
      "Her television series The Debbie Reynolds Show earned her a Golden Globe nomination
      in 1969. She starred in the 1973 Broadway revival of the musical Irene, which
      earned her a Tony Award nomination for Best Leading Actress in a Musical. She
      was also nominated for a Daytime Emmy Award for her performance in A Gift of
      Love (1999). After appearing in the popular early-2000s sitcom Will & Grace,
      Reynolds was nominated for a Primetime Emmy Award for Outstanding Guest Actress
      in a Comedy Series for her role as Bobbi, the mother of Grace Adler. Reynolds
      would reach a new, younger audience with her role as Aggie Cromwell in Disney''s
      Halloweentown series.", "49382e7207434a7087f6d0766a616193/t/text/0-763": "Fisher
      was the daughter of singer Eddie Fisher and actress Debbie Reynolds. She and
      her mother appear together in Bright Lights: Starring Carrie Fisher and Debbie
      Reynolds, a documentary about their relationship. It premiered at the 2016 Cannes
      Film Festival. She earned praise for speaking publicly about her experiences
      with bipolar disorder and drug addiction.[10] Fisher died of a sudden cardiac
      arrest in December 2016, at age 60, four days after experiencing a medical emergency
      during a transatlantic flight from London to Los Angeles. She was posthumously
      made a Disney Legend in 2017,[11] and was awarded a posthumous Grammy Award
      for Best Spoken Word Album the following year. In 2023, she posthumously received
      a star on the Hollywood Walk of Fame.[12]", "060abac9fd8f48d0b4f2c310e9840f7a/t/text/0-495":
      "After Comden and Green had returned to New York to work on other projects,
      they received word that a new song was needed for a love-song sequence between
      Kelly and Debbie Reynolds. The original had been a song-and-dance medley involving
      different sets in different soundstages on the studio lot, but they were asked
      for a romantic love song set in an empty sound stage, and it was needed immediately.
      Comden and Green provided such a scene for You Were Meant for Me and sent it
      off to Hollywood.", "7198cc70a29f4d9c91c231b205e28bcd/t/text/0-581": "Mary Frances
      Reynolds was born on April 1, 1932, in El Paso, Texas, to Maxene N. Minnie Harman
      and Raymond Francis Ray Reynolds, a carpenter who worked for the Southern Pacific
      Railroad.[citation needed] She was of Scottish-Irish and English ancestry[9]
      and was raised in a strict Nazarene church of her domineering mother.[10] She
      had an older brother, William, who was two years her senior.[11] Reynolds was
      a Girl Scout, once saying that she wanted to die as the world''s oldest living
      Girl Scout.[12] Reynolds was also a member of The International Order of Job''s
      Daughters.[13]", "9b50cca7d8f6451aa4b11f8279e85af9/t/text/0-591": "Reynolds
      was a longtime ally of the LGBT community and an early advocate for people with
      AIDS.[67] In 1983, Reynolds performed at an AIDS fundraiser with her friend
      Shirley MacLaine.[68] In a 2014 interview with The Daily Telegraph, Reynolds
      revealed that she had helped several closeted actors conceal their homosexuality
      by dating them.[69] When asked when she realized she was a gay icon, Reynolds
      replied, Over the years many of the boys that have worked for me as dancers
      have been gay. The creative people were all gay people, from producers to writers.
      To me, they were just family. [", "12bd490d2e0e4f3e97bbc75e9df9beb1/t/text/0-736":
      "Her starring role in The Unsinkable Molly Brown (1964) led to a nomination
      for the Academy Award for Best Actress.[22] Reynolds noted that she initially
      had issues with its director, Charles Walters. He didn''t want me, she said.
      He wanted Shirley MacLaine, who at the time was unable to take the role. He
      said, ''You are totally wrong for the part.'' But six weeks into production,
      he reversed his opinion. He came to me and said, ''I have to admit that I was
      wrong. You are playing the role really well. I''m pleased.'' [23] Reynolds also
      played in Goodbye Charlie, a 1964 comedy film about a callous womanizer who
      gets his just reward. It was adapted from George Axelrod''s play Goodbye, Charlie
      and also starred Tony Curtis and Pat Boone. ", "d04233be4a974271bc947424972cbdba/t/text/0-394":
      "On December 28, 2016, Reynolds was taken by ambulance to Cedars-Sinai Medical
      Center in Los Angeles, after suffering a severe stroke, according to her son.[80]
      Later that afternoon, Reynolds was pronounced dead in the hospital; she was
      84 years old.[81][82][83] On January 9, 2017, her cause of death was determined
      to be an intracerebral hemorrhage, with hypertension a contributing factor.[84",
      "c610a89b43a448bd9f2a00ab7333bd3c/t/text/0-512": "Reynolds was married three
      times. Her first marriage was to singer and actor Eddie Fisher in 1955.[71]
      They became the parents of Carrie Fisher and Todd Fisher. The couple divorced
      in 1959 when it was revealed shortly after the death of Elizabeth Taylor''s
      husband Mike Todd that Fisher had been having an affair with her; Taylor and
      Reynolds were good friends at the time. The Eddie Fisher \u2013 Elizabeth Taylor
      affair was a great public scandal, which led to the cancellation of Eddie Fisher''s
      television show.[72]", "12bd490d2e0e4f3e97bbc75e9df9beb1/a/title/0-15": "Debbie
      Reynolds", "56f11f6ec7f44ff8bc1c4211852fc29e/a/title/0-15": "Debbie Reynolds",
      "7198cc70a29f4d9c91c231b205e28bcd/a/title/0-15": "Debbie Reynolds", "9b50cca7d8f6451aa4b11f8279e85af9/a/title/0-15":
      "Debbie Reynolds", "adce3e560e664fbe90f53bfe49a5b496/a/title/0-15": "Debbie
      Reynolds", "c610a89b43a448bd9f2a00ab7333bd3c/a/title/0-15": "Debbie Reynolds",
      "d04233be4a974271bc947424972cbdba/a/title/0-15": "Debbie Reynolds", "f03cab2815f148c584c66bdaa5e595cf/a/title/0-15":
      "Debbie Reynolds", "bbf12fa5604f4da98f128fc3fd58d97d/t/text/0-450": "Singin''
      in the Rain is a 1952 American musical romantic comedy film directed and choreographed
      by Gene Kelly and Stanley Donen, starring Kelly, Donald O''Connor and Debbie
      Reynolds, with Jean Hagen, Millard Mitchell, Douglas Fowley, Rita Moreno and
      Cyd Charisse in supporting roles. It offers a lighthearted depiction of Hollywood
      in the late 1920s, with the three stars portraying performers caught up in the
      transition from silent films to talkies .", "940c91d43ef24de794e7b4739c993f39/t/text/0-812":
      "Carrie Frances Fisher (October 21, 1956 \u2013 December 27, 2016) was an American
      actress and writer.[1] She is best known for playing Princess Leia in the original
      Star Wars films (1977\u20131983) and reprised the role in The Force Awakens
      (2015), The Last Jedi (2017)\u2014a posthumous release that was dedicated to
      her[2][3]\u2014and The Rise of Skywalker (2019), the latter using unreleased
      footage from The Force Awakens.[4][5] Her other film credits include Shampoo
      (1975), The Blues Brothers (1980), Hannah and Her Sisters (1986), The ''Burbs
      (1989), When Harry Met Sally... (1989), Soapdish (1991), and The Women (2008).[6]
      She was nominated twice for the Primetime Emmy Award for Outstanding Guest Actress
      in a Comedy Series for her performances in the NBC sitcom 30 Rock (2007) and
      the Channel 4 series Catastrophe (2017). ", "6c88fab70363467b80428dabdd37b76c/t/text/0-973":
      "Star Wars (later retitled as Star Wars: Episode IV \u2013 A New Hope) is a
      1977 American epic space opera film written and directed by George Lucas. Produced
      by Lucasfilm Ltd. and distributed by Twentieth Century-Fox, it is the first
      film in the Star Wars franchise and the fourth chronological chapter of the
      Skywalker Saga . Set in a fictional galaxy under the rule of the tyrannical
      Galactic Empire, the film follows a resistance movement, called the Rebel Alliance,
      that aims to destroy the Empire''s ultimate weapon, the Death Star. When the
      rebel leader Princess Leia is captured by the Galactic Empire, Luke Skywalker
      acquires stolen architectural plans for the Death Star and sets out to rescue
      her while learning the ways of a metaphysical power known as the Force from
      the Jedi Master Obi-Wan Kenobi. The film stars Mark Hamill, Harrison Ford, Carrie
      Fisher, Peter Cushing, Alec Guinness, Anthony Daniels, Kenny Baker, Peter Mayhew,
      David Prowse, and James Earl Jones. ", "56f11f6ec7f44ff8bc1c4211852fc29e/t/text/0-615":
      "Todd Fisher later said that Reynolds had been seriously affected by her daughter''s
      death, and that her grief partially contributed to her stroke, noting that his
      mother had stated, I want to be with Carrie, shortly before she died.[86][87][88]
      During an interview for the December 30, 2016, airing of the ABC-TV program
      20/20, Todd Fisher elaborated on this, saying that his mother had joined his
      sister in death because Reynolds didn''t want to leave Carrie and did not want
      her to be alone. [89] He added, she didn''t die of a broken heart as some news
      reports had implied, but rather just left to be with Carrie. [", "4b509d5501be4cc3bde4b30c7349c290/t/text/0-801":
      "Return of the Jedi (also known as Star Wars: Episode VI \u2013 Return of the
      Jedi) is a 1983 American epic space opera film directed by Richard Marquand
      from a screenplay by Lawrence Kasdan and George Lucas. The sequel to The Empire
      Strikes Back (1980), it is the third installment in the original Star Wars trilogy
      and the sixth chronological film in the Skywalker Saga . The film follows the
      ongoing struggle between the malevolent Galactic Empire and the freedom fighters
      of the Rebel Alliance. As the rebels attempt to destroy the Empire''s second
      Death Star, Luke Skywalker tries to bring his father, Darth Vader, back from
      the dark side of the Force. The film stars Mark Hamill, Harrison Ford, Carrie
      Fisher, Billy Dee Williams, Anthony Daniels, David Prowse, Kenny Baker, Peter
      Mayhew, and Frank Oz. ", "a8510b7c2d7f40168c0c2581b2bc2eba/t/text/0-889": "The
      Empire Strikes Back (also known as Star Wars: Episode V \u2013 The Empire Strikes
      Back) is a 1980 American epic space opera film directed by Irvin Kershner from
      a screenplay by Leigh Brackett and Lawrence Kasdan, based on a story by George
      Lucas. The sequel to Star Wars (1977),[ii] it is the second film in the Star
      Wars film series and the fifth chronological chapter of the Skywalker Saga .
      Set three years after the events of Star Wars, the film recounts the battle
      between the malevolent Galactic Empire, led by the Emperor, and the Rebel Alliance,
      led by Luke Skywalker and Princess Leia. As the Empire goes on the offensive,
      Luke trains to master the Force so he can confront the Emperor''s powerful disciple,
      Darth Vader. The ensemble cast includes Mark Hamill, Harrison Ford, Carrie Fisher,
      Billy Dee Williams, Anthony Daniels, David Prowse, Kenny Baker, Peter Mayhew,
      and Frank Oz.", "c5c8c22970d6458c8ed170d386da2688/f/d85166150123490ab51da42681f71e19/757-958":
      " \n 5. \n \n Bake for 8-10 minutes, or until edges are lightly golden brown.6.
      \n Let cookies cool on baking sheets for a few minutes before transferring to
      a wire \n rack to cool completely. \n \n 7. \n \n \n  ", "f64d6dd68c4d4b27962e0636b76cf7d3/f/3c473649f9044f03aa6c06e0b6da43da/1455-1678":
      " For a richer flavor, you can use brown butter instead of regular butter. To
      make brown \n butter, melt the butter in a saucepan over medium heat, swirling
      it occasionally, until it \n turns golden brown and starts to foam. \n", "f64d6dd68c4d4b27962e0636b76cf7d3/f/3c473649f9044f03aa6c06e0b6da43da/979-1227":
      " \n 7. \n \n Bake for 10-12 minutes, or until golden brown around the edges
      but still slightly soft in \n the center. \n \n 8. \n \n Let the cookies cool
      on the baking sheets for a few minutes before transferring them to a \n wire
      rack to cool completely. \n", "f64d6dd68c4d4b27962e0636b76cf7d3/f/3c473649f9044f03aa6c06e0b6da43da/1227-1455":
      " \n 9. \n \n For chewier cookies, use 1/2 cup light brown sugar and 1/2 cup
      dark brown sugar. \n For crispier cookies, bake for 13-15 minutes. \n You can
      also add chopped nuts, pretzels, or dried fruit to the dough for a variation.
      \n", "8387464bca6f408fbfdbca79a1bc72bb/f/589d7f53b72c45758f94a90bd16e3211/1120-1338":
      " If your bananas are not very ripe, you can brown them in a pan over medium
      heat for a \n few minutes before mashing them. \n This recipe can also be made
      into muffins. Simply bake for 20-25 minutes at 350\u00b0F \n (175\u00b0C). \n",
      "c8ba7316fbd74fea98cb39c282881f67/f/05e897bfb9914f3e8056ddc521ac6df5/1252-1529":
      " \n 3. \n \n Gradually add wet ingredients to dry ingredients, mixing until
      just combined. \n Fold in carrots and nuts (if using). \n \n 4. \n \n Divide
      batter evenly between prepared cake pans. Bake for 30-35 minutes, or \n until
      a toothpick inserted into the center comes out clean. \n", "c8ba7316fbd74fea98cb39c282881f67/f/05e897bfb9914f3e8056ddc521ac6df5/1529-1799":
      " \n 5. \n \n Let cakes cool in pans for 10 minutes, then transfer to a wire
      rack to cool \n completely. \n \n 6. \n \n While cakes cool, prepare the frosting:
      Beat cream cheese and butter until \n smooth and creamy. Gradually add powdered
      sugar, beating until light and fluffy. \n", "b2ca502f6aa94cbea8a1039d6764b5ca/t/text/0-234":
      "On the morning of December 27, 2016, after being in intensive care for four
      days, Fisher died at the age of 60 at the UCLA Medical Center.[144] Fisher''s
      daughter, Billie Lourd, confirmed her mother''s death in a statement to the
      press.", "5aeaf6dea66141198c307f913e6e6b99/f/2081015753104886b2536c3ef8ad1f92/973-1220":
      " Bake for 55-65 minutes, or until a toothpick inserted into the center comes
      out clean.7. \n Let cool in the pan for 10 minutes, then transfer to a wire
      rack to cool completely.8. \n \n For extra moisture, use applesauce instead
      of half of the oil. \n", "99ac6d905f5c4585997cacabe7ea8639/f/38ea6718a3fb435088446379ec381f08/794-1051":
      " \n 3. \n \n Pour the batter into the prepared pan and bake for 20-35 minutes,
      or until a \n toothpick inserted into the center comes out clean. \n \n 4. \n
      \n Let the cake cool in the pan for a few minutes before transferring to a wire
      rack \n to cool completely. \n", "8387464bca6f408fbfdbca79a1bc72bb/f/589d7f53b72c45758f94a90bd16e3211/841-1120":
      " \n 6. \n \n Let the bread cool in the pan for 10 minutes, then turn out onto
      a wire rack to \n cool completely. \n \n 7. \n \n For extra moist bread, use
      brown sugar instead of granulated sugar. \n Add in some chopped nuts, chocolate
      chips, or dried fruit for extra flavor and texture. \n", "c8ba7316fbd74fea98cb39c282881f67/f/05e897bfb9914f3e8056ddc521ac6df5/2084-2356":
      " If you don''t have applesauce, you can substitute sour cream or plain yogurt.
      \n Decorate your cake with chopped walnuts, pecans, or a sprinkle of cinnamon
      \n sugar. \n This cake can be stored at room temperature for up to 3 days, or
      in the \n refrigerator for up to 5 days. \n", "c8ba7316fbd74fea98cb39c282881f67/f/05e897bfb9914f3e8056ddc521ac6df5/1799-2084":
      " Stir in vanilla extract and salt. \n \n 7. \n \n Once cakes are cool, frost
      the top of one cake layer and place the other layer on \n top. Frost the entire
      cake with the remaining frosting. \n \n 8. \n \n For extra moisture, add 1/2
      cup of pineapple crushed in its own juice to the \n batter. \n", "8387464bca6f408fbfdbca79a1bc72bb/f/589d7f53b72c45758f94a90bd16e3211/535-841":
      " Gradually add the flour, mixing until just combined. Do not overmix.4. \n
      Pour the batter into the prepared loaf pan.5. \n Bake for 55-65 minutes at 350\u00b0F
      (175\u00b0C), or until a toothpick or wooden skewer \n inserted into the center
      comes out clean. A few dry crumbs are okay; streaks of \n wet batter are not.
      \n", "ca4c75ab0f14480ba80c4981bb0b231d/t/text/0-365": "In a January 2014 interview,
      Fisher confirmed her involvement and the involvement of the original cast in
      the upcoming sequels by saying as for the next Star Wars film, myself, Harrison
      Ford and Mark Hamill are expected to report to work in March or April. I''d
      like to wear my old cinnamon buns hairstyle again but with white hair. I think
      that would be funny. [90]", "db18e2f4eda449ffb9268a06052795a7/t/text/0-724":
      "In 1927, silent film stars Don Lockwood and Lina Lamont attend the premiere
      of their latest film, The Royal Rascal, produced by Hollywood studio Monumental
      Pictures. On the red carpet, Don tells the story of his rise to stardom, claiming
      to have grown up cultured and highly educated. His words are contradicted by
      flashbacks showing his humble roots as a hoofer, vaudeville musician and stuntman
      alongside his childhood best friend and longtime collaborator Cosmo Brown, accompanied
      by the song Fit as a Fiddle . Don also expresses his admiration for Lina, feeding
      rumors of a secret romance between them. In reality, the rumors are a publicity
      stunt and Don barely tolerates Lina, although she believes that he loves her.
      ", "1605e9213f4c4b9cb4720fed3b0f9ffb/t/text/0-813": "Singin'' in the Rain was
      originally conceived by MGM producer Arthur Freed, the head of the Freed Unit
      responsible for turning out MGM''s lavish musicals, as a vehicle for his catalog
      of songs written with Nacio Herb Brown for previous MGM musical films of the
      1929\u201339 period.[11] Screenwriters Betty Comden and Adolph Green wrote one
      entirely new song, Moses Supposes , with music director Roger Edens providing
      the music (see below).[12] Freed and Brown wrote a new song for the movie, Make
      ''Em Laugh , though it bears a striking resemblance to Cole Porter''s Be a Clown
      from another MGM Freed-produced musical, The Pirate (1948). Donen, who had asked
      the pair to write a song inspired by Be a Clown , considered the result to be
      100% plagiarism .[13] However, Porter never sued for copyright infringement.[14][15]"}}'
