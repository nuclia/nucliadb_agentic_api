      be delimited by tags such as <START OF CONTEXT> and <END OF CONTEXT>. Treat
      everything between these tags as context.\n6. Assess whether the context sufficiently
      answers the question. If it answers it partially, provide the answer; if it
      does not answer it fully, specify what information is missing to answer the
      question.\n7. If the context does not answer the question at all, just return
      the original question as the missing information.\n8. The `citations` field
      consists ONLY in a list of block IDs that are relevant to the answer, following
      these rules:\n  - Use the format: block-AB\n  - Just mention the block IDs,
      do NOT include any other text.\n  - Just mention the blocks actually relevant
      and that contain information used in the answer, do NOT include blocks that
      are not relevant.\n  - No duplicates.\n9. Do NOT hallucinate block IDs. Only
      use those provided in the context.\n10. Your output must be a JSON object with
      the following fields:\n    - \"reason\": Explain your reasoning for the answer
      or validation.\n    - \"answer\": Provide a partial or complete answer to the
      user query strictly from the information in the context. If there isn''t enough
      information to even provide a partial answer, leave ''answer'' empty.\n    -
      \"missing_info_query\": If the context is insufficient, specify what information
