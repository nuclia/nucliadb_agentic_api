- request:
    body: '{"question": "Who is Carrie Fisher''s mother and what is she known for?",
      "user_id": "401dbfc5e4b94e46838c9fedf97b0889", "retrieval": true, "system":
      null, "query_context": {"49382e7207434a7087f6d0766a616193/t/text/0-763": "Fisher
      was the daughter of singer Eddie Fisher and actress Debbie Reynolds. She and
      her mother appear together in Bright Lights: Starring Carrie Fisher and Debbie
      Reynolds, a documentary about their relationship. It premiered at the 2016 Cannes
      Film Festival. She earned praise for speaking publicly about her experiences
      with bipolar disorder and drug addiction.[10] Fisher died of a sudden cardiac
      arrest in December 2016, at age 60, four days after experiencing a medical emergency
      during a transatlantic flight from London to Los Angeles. She was posthumously
      made a Disney Legend in 2017,[11] and was awarded a posthumous Grammy Award
      for Best Spoken Word Album the following year. In 2023, she posthumously received
      a star on the Hollywood Walk of Fame.[12]", "940c91d43ef24de794e7b4739c993f39/t/text/0-812":
      "Carrie Frances Fisher (October 21, 1956 \u2013 December 27, 2016) was an American
      actress and writer.[1] She is best known for playing Princess Leia in the original
      Star Wars films (1977\u20131983) and reprised the role in The Force Awakens
      (2015), The Last Jedi (2017)\u2014a posthumous release that was dedicated to
      her[2][3]\u2014and The Rise of Skywalker (2019), the latter using unreleased
      footage from The Force Awakens.[4][5] Her other film credits include Shampoo
      (1975), The Blues Brothers (1980), Hannah and Her Sisters (1986), The ''Burbs
      (1989), When Harry Met Sally... (1989), Soapdish (1991), and The Women (2008).[6]
      She was nominated twice for the Primetime Emmy Award for Outstanding Guest Actress
      in a Comedy Series for her performances in the NBC sitcom 30 Rock (2007) and
      the Channel 4 series Catastrophe (2017).", "c610a89b43a448bd9f2a00ab7333bd3c/t/text/0-512":
      "Reynolds was married three times. Her first marriage was to singer and actor
      Eddie Fisher in 1955.[71] They became the parents of Carrie Fisher and Todd
      Fisher. The couple divorced in 1959 when it was revealed shortly after the death
      of Elizabeth Taylor''s husband Mike Todd that Fisher had been having an affair
      with her; Taylor and Reynolds were good friends at the time. The Eddie Fisher
      \u2013 Elizabeth Taylor affair was a great public scandal, which led to the
      cancellation of Eddie Fisher''s television show.[72]", "b2ca502f6aa94cbea8a1039d6764b5ca/t/text/0-234":
      "On the morning of December 27, 2016, after being in intensive care for four
      days, Fisher died at the age of 60 at the UCLA Medical Center.[144] Fisher''s
      daughter, Billie Lourd, confirmed her mother''s death in a statement to the
      press.", "a8510b7c2d7f40168c0c2581b2bc2eba/t/text/0-889": "The Empire Strikes
      Back (also known as Star Wars: Episode V \u2013 The Empire Strikes Back) is
      a 1980 American epic space opera film directed by Irvin Kershner from a screenplay
      by Leigh Brackett and Lawrence Kasdan, based on a story by George Lucas. The
      sequel to Star Wars (1977),[ii] it is the second film in the Star Wars film
      series and the fifth chronological chapter of the Skywalker Saga . Set three
      years after the events of Star Wars, the film recounts the battle between the
      malevolent Galactic Empire, led by the Emperor, and the Rebel Alliance, led
      by Luke Skywalker and Princess Leia. As the Empire goes on the offensive, Luke
      trains to master the Force so he can confront the Emperor''s powerful disciple,
      Darth Vader. The ensemble cast includes Mark Hamill, Harrison Ford, Carrie Fisher,
      Billy Dee Williams, Anthony Daniels, David Prowse, Kenny Baker, Peter Mayhew,
      and Frank Oz.", "4b509d5501be4cc3bde4b30c7349c290/t/text/0-801": "Return of
      the Jedi (also known as Star Wars: Episode VI \u2013 Return of the Jedi) is
      a 1983 American epic space opera film directed by Richard Marquand from a screenplay
      by Lawrence Kasdan and George Lucas. The sequel to The Empire Strikes Back (1980),
      it is the third installment in the original Star Wars trilogy and the sixth
      chronological film in the Skywalker Saga . The film follows the ongoing struggle
      between the malevolent Galactic Empire and the freedom fighters of the Rebel
      Alliance. As the rebels attempt to destroy the Empire''s second Death Star,
      Luke Skywalker tries to bring his father, Darth Vader, back from the dark side
      of the Force. The film stars Mark Hamill, Harrison Ford, Carrie Fisher, Billy
      Dee Williams, Anthony Daniels, David Prowse, Kenny Baker, Peter Mayhew, and
      Frank Oz.", "56f11f6ec7f44ff8bc1c4211852fc29e/t/text/0-615": "Todd Fisher later
      said that Reynolds had been seriously affected by her daughter''s death, and
      that her grief partially contributed to her stroke, noting that his mother had
      stated, I want to be with Carrie, shortly before she died.[86][87][88] During
      an interview for the December 30, 2016, airing of the ABC-TV program 20/20,
      Todd Fisher elaborated on this, saying that his mother had joined his sister
      in death because Reynolds didn''t want to leave Carrie and did not want her
      to be alone. [89] He added, she didn''t die of a broken heart as some news reports
      had implied, but rather just left to be with Carrie. [", "6c88fab70363467b80428dabdd37b76c/t/text/0-973":
      "Star Wars (later retitled as Star Wars: Episode IV \u2013 A New Hope) is a
      1977 American epic space opera film written and directed by George Lucas. Produced
      by Lucasfilm Ltd. and distributed by Twentieth Century-Fox, it is the first
      film in the Star Wars franchise and the fourth chronological chapter of the
      Skywalker Saga . Set in a fictional galaxy under the rule of the tyrannical
      Galactic Empire, the film follows a resistance movement, called the Rebel Alliance,
      that aims to destroy the Empire''s ultimate weapon, the Death Star. When the
      rebel leader Princess Leia is captured by the Galactic Empire, Luke Skywalker
      acquires stolen architectural plans for the Death Star and sets out to rescue
      her while learning the ways of a metaphysical power known as the Force from
      the Jedi Master Obi-Wan Kenobi. The film stars Mark Hamill, Harrison Ford, Carrie
      Fisher, Peter Cushing, Alec Guinness, Anthony Daniels, Kenny Baker, Peter Mayhew,
      David Prowse, and James Earl Jones.", "62fd4320b52e4d0aa4ef4afc6c8ae4a2/t/text/0-771":
      "Fisher appeared in the film The Blues Brothers as Jake''s vengeful ex-lover;
      she is listed in the credits as Mystery Woman .[43] While Fisher was in Chicago
      filming the movie, she choked on a Brussels sprout; Dan Aykroyd performed the
      Heimlich maneuver which saved my life , according to Fisher.[44] She appeared
      on Broadway in Censored Scenes from King Kong in 1980. The same year, she reprised
      her role as Princess Leia in The Empire Strikes Back, and appeared with her
      Star Wars co-stars on the cover of the July 12, 1980, issue of Rolling Stone
      to promote the film.[45] She also starred as Sister Agnes in the Broadway production
      of Agnes of God in 1983,[46][47] a run which overlapped with her mother''s appearance
      in the Broadway company of Woman of the Year.[48][49]", "7198cc70a29f4d9c91c231b205e28bcd/t/text/0-581":
      "Mary Frances Reynolds was born on April 1, 1932, in El Paso, Texas, to Maxene
      N. Minnie Harman and Raymond Francis Ray Reynolds, a carpenter who worked for
      the Southern Pacific Railroad.[citation needed] She was of Scottish-Irish and
      English ancestry[9] and was raised in a strict Nazarene church of her domineering
      mother.[10] She had an older brother, William, who was two years her senior.[11]
      Reynolds was a Girl Scout, once saying that she wanted to die as the world''s
      oldest living Girl Scout.[12] Reynolds was also a member of The International
      Order of Job''s Daughters.[13]", "49382e7207434a7087f6d0766a616193/a/title":
      "Carrie Fisher", "940c91d43ef24de794e7b4739c993f39/a/title": "Carrie Fisher",
      "c610a89b43a448bd9f2a00ab7333bd3c/a/title": "Debbie Reynolds", "b2ca502f6aa94cbea8a1039d6764b5ca/a/title":
      "Star Wars", "a8510b7c2d7f40168c0c2581b2bc2eba/a/title": "Star Wars", "4b509d5501be4cc3bde4b30c7349c290/a/title":
