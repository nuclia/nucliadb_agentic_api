      with parameters {''question'': \"Who is Carrie Fisher''s mother, and what are
      her notable achievements or roles?\"}\n``` Todd Fisher later said that Reynolds
      had been seriously affected by her daughter''s death, and that her grief partially
      contributed to her stroke, noting that his mother had stated, I want to be with
      Carrie, shortly before she died.[86][87][88] During an interview for the December
      30, 2016, airing of the ABC-TV program 20/20, Todd Fisher elaborated on this,
      saying that his mother had joined his sister in death because Reynolds didn''t
      want to leave Carrie and did not want her to be alone. [89] He added, she didn''t
      die of a broken heart as some news reports had implied, but rather just left
      to be with Carrie. [ ```\n\n\n## Chunk: Debbie Reynolds\nResult of running:
