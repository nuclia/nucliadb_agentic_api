    body: '{"question": "Who is Carrie Fisher''s mother and what are her known accomplishments?",
      "user_id": "", "context": {"b2ca502f6aa94cbea8a1039d6764b5ca/t/text/0-234":
      "On the morning of December 27, 2016, after being in intensive care for four
      days, Fisher died at the age of 60 at the UCLA Medical Center.[144] Fisher''s
      daughter, Billie Lourd, confirmed her mother''s death in a statement to the
      press.", "940c91d43ef24de794e7b4739c993f39/t/text/0-812": "Carrie Frances Fisher
      (October 21, 1956 \u2013 December 27, 2016) was an American actress and writer.[1]
      She is best known for playing Princess Leia in the original Star Wars films
      (1977\u20131983) and reprised the role in The Force Awakens (2015), The Last
      Jedi (2017)\u2014a posthumous release that was dedicated to her[2][3]\u2014and
      The Rise of Skywalker (2019), the latter using unreleased footage from The Force
      Awakens.[4][5] Her other film credits include Shampoo (1975), The Blues Brothers
      (1980), Hannah and Her Sisters (1986), The ''Burbs (1989), When Harry Met Sally...
      (1989), Soapdish (1991), and The Women (2008).[6] She was nominated twice for
      the Primetime Emmy Award for Outstanding Guest Actress in a Comedy Series for
      her performances in the NBC sitcom 30 Rock (2007) and the Channel 4 series Catastrophe
      (2017). ", "49382e7207434a7087f6d0766a616193/t/text/0-763": "Fisher was the
      daughter of singer Eddie Fisher and actress Debbie Reynolds. She and her mother
      appear together in Bright Lights: Starring Carrie Fisher and Debbie Reynolds,
      a documentary about their relationship. It premiered at the 2016 Cannes Film
      Festival. She earned praise for speaking publicly about her experiences with
      bipolar disorder and drug addiction.[10] Fisher died of a sudden cardiac arrest
      in December 2016, at age 60, four days after experiencing a medical emergency
      during a transatlantic flight from London to Los Angeles. She was posthumously
      made a Disney Legend in 2017,[11] and was awarded a posthumous Grammy Award
      for Best Spoken Word Album the following year. In 2023, she posthumously received
      a star on the Hollywood Walk of Fame.[12]", "56f11f6ec7f44ff8bc1c4211852fc29e/t/text/0-615":
      "Todd Fisher later said that Reynolds had been seriously affected by her daughter''s
      death, and that her grief partially contributed to her stroke, noting that his
      mother had stated, I want to be with Carrie, shortly before she died.[86][87][88]
      During an interview for the December 30, 2016, airing of the ABC-TV program
      20/20, Todd Fisher elaborated on this, saying that his mother had joined his
      sister in death because Reynolds didn''t want to leave Carrie and did not want
      her to be alone. [89] He added, she didn''t die of a broken heart as some news
      reports had implied, but rather just left to be with Carrie. [", "62fd4320b52e4d0aa4ef4afc6c8ae4a2/t/text/0-771":
      "Fisher appeared in the film The Blues Brothers as Jake''s vengeful ex-lover;
      she is listed in the credits as Mystery Woman .[43] While Fisher was in Chicago
      filming the movie, she choked on a Brussels sprout; Dan Aykroyd performed the
      Heimlich maneuver which saved my life , according to Fisher.[44] She appeared
      on Broadway in Censored Scenes from King Kong in 1980. The same year, she reprised
      her role as Princess Leia in The Empire Strikes Back, and appeared with her
      Star Wars co-stars on the cover of the July 12, 1980, issue of Rolling Stone
      to promote the film.[45] She also starred as Sister Agnes in the Broadway production
      of Agnes of God in 1983,[46][47] a run which overlapped with her mother''s appearance
      in the Broadway company of Woman of the Year.[48][49]", "c610a89b43a448bd9f2a00ab7333bd3c/t/text/0-512":
      "Reynolds was married three times. Her first marriage was to singer and actor
      Eddie Fisher in 1955.[71] They became the parents of Carrie Fisher and Todd
      Fisher. The couple divorced in 1959 when it was revealed shortly after the death
      of Elizabeth Taylor''s husband Mike Todd that Fisher had been having an affair
      with her; Taylor and Reynolds were good friends at the time. The Eddie Fisher
      \u2013 Elizabeth Taylor affair was a great public scandal, which led to the
      cancellation of Eddie Fisher''s television show.[72]", "bcd4175ce000442397bda1b1b72f7421/t/text/0-419":
      "Fisher made her film debut in 1975 as the precociously seductive character
      Lorna Karpf in the Columbia Pictures comedy Shampoo, filmed in mid-1974, when
      she was age 17.[6] In 1977, Fisher starred as Princess Leia in George Lucas''
      space opera film Star Wars opposite Mark Hamill and Harrison Ford.[37] Though
      she and her fellow actors were not close at the time, they bonded after the
      commercial success of the film.[38]", "7198cc70a29f4d9c91c231b205e28bcd/t/text/0-581":
      "Mary Frances Reynolds was born on April 1, 1932, in El Paso, Texas, to Maxene
      N. Minnie Harman and Raymond Francis Ray Reynolds, a carpenter who worked for
      the Southern Pacific Railroad.[citation needed] She was of Scottish-Irish and
      English ancestry[9] and was raised in a strict Nazarene church of her domineering
      mother.[10] She had an older brother, William, who was two years her senior.[11]
      Reynolds was a Girl Scout, once saying that she wanted to die as the world''s
      oldest living Girl Scout.[12] Reynolds was also a member of The International
      Order of Job''s Daughters.[13]", "0c2364c1d877453cb73dfdd4e2926537/t/text/0-361":
      "In 1983, Fisher returned to the role of Princess Leia in Return of the Jedi,
      and posed in the character''s metal bikini on the cover of the Summer 1983 issue
      of Rolling Stone to promote the film.[50][51] The costume later achieved a following
      of its own.[52] In 1986, she starred along with Barbara Hershey and Mia Farrow
      in Woody Allen''s Hannah and Her Sisters.", "dc2d3b3914e6498da494a5f8d3f6530f/t/text/0-549":
      "In April 1978, Fisher appeared as the love interest in Ringo Starr''s 1978
      TV special Ringo.[39] The next month, she starred alongside John Ritter (who
      had also appeared in Ringo) in the ABC-TV film Leave Yesterday Behind.[40] At
      this time, Fisher appeared with Laurence Olivier and Joanne Woodward in the
      anthology series Laurence Olivier Presents in a television version of the William
      Inge play Come Back, Little Sheba.[41] That November, she played Princess Leia
      in the 1978 TV production Star Wars Holiday Special, and sang in the last scene.[42",
      "01a946a828fe484a8611f995d70a56ee/a/title/0-13": "Carrie Fisher", "0c2364c1d877453cb73dfdd4e2926537/a/title/0-13":
      "Carrie Fisher", "49382e7207434a7087f6d0766a616193/a/title/0-13": "Carrie Fisher",
      "52bfb1adcce74cda94c62576b037c4f2/a/title/0-13": "Carrie Fisher", "62fd4320b52e4d0aa4ef4afc6c8ae4a2/a/title/0-13":
      "Carrie Fisher", "940c91d43ef24de794e7b4739c993f39/a/title/0-13": "Carrie Fisher",
      "bcd4175ce000442397bda1b1b72f7421/a/title/0-13": "Carrie Fisher", "ca4c75ab0f14480ba80c4981bb0b231d/a/title/0-13":
      "Carrie Fisher", "dc2d3b3914e6498da494a5f8d3f6530f/a/title/0-13": "Carrie Fisher",
      "fcce2cee55ff41408b337fca9230b6a4/a/title/0-13": "Carrie Fisher", "4b509d5501be4cc3bde4b30c7349c290/t/text/0-801":
      "Return of the Jedi (also known as Star Wars: Episode VI \u2013 Return of the
      Jedi) is a 1983 American epic space opera film directed by Richard Marquand
      from a screenplay by Lawrence Kasdan and George Lucas. The sequel to The Empire
      Strikes Back (1980), it is the third installment in the original Star Wars trilogy
      and the sixth chronological film in the Skywalker Saga . The film follows the
      ongoing struggle between the malevolent Galactic Empire and the freedom fighters
      of the Rebel Alliance. As the rebels attempt to destroy the Empire''s second
      Death Star, Luke Skywalker tries to bring his father, Darth Vader, back from
      the dark side of the Force. The film stars Mark Hamill, Harrison Ford, Carrie
      Fisher, Billy Dee Williams, Anthony Daniels, David Prowse, Kenny Baker, Peter
      Mayhew, and Frank Oz. ", "6c88fab70363467b80428dabdd37b76c/t/text/0-973": "Star
      Wars (later retitled as Star Wars: Episode IV \u2013 A New Hope) is a 1977 American
      epic space opera film written and directed by George Lucas. Produced by Lucasfilm
      Ltd. and distributed by Twentieth Century-Fox, it is the first film in the Star
      Wars franchise and the fourth chronological chapter of the Skywalker Saga .
      Set in a fictional galaxy under the rule of the tyrannical Galactic Empire,
      the film follows a resistance movement, called the Rebel Alliance, that aims
      to destroy the Empire''s ultimate weapon, the Death Star. When the rebel leader
      Princess Leia is captured by the Galactic Empire, Luke Skywalker acquires stolen
      architectural plans for the Death Star and sets out to rescue her while learning
      the ways of a metaphysical power known as the Force from the Jedi Master Obi-Wan
      Kenobi. The film stars Mark Hamill, Harrison Ford, Carrie Fisher, Peter Cushing,
      Alec Guinness, Anthony Daniels, Kenny Baker, Peter Mayhew, David Prowse, and
      James Earl Jones. ", "a8510b7c2d7f40168c0c2581b2bc2eba/t/text/0-889": "The Empire
      Strikes Back (also known as Star Wars: Episode V \u2013 The Empire Strikes Back)
      is a 1980 American epic space opera film directed by Irvin Kershner from a screenplay
      by Leigh Brackett and Lawrence Kasdan, based on a story by George Lucas. The
      sequel to Star Wars (1977),[ii] it is the second film in the Star Wars film
      series and the fifth chronological chapter of the Skywalker Saga . Set three
      years after the events of Star Wars, the film recounts the battle between the
      malevolent Galactic Empire, led by the Emperor, and the Rebel Alliance, led
      by Luke Skywalker and Princess Leia. As the Empire goes on the offensive, Luke
      trains to master the Force so he can confront the Emperor''s powerful disciple,
      Darth Vader. The ensemble cast includes Mark Hamill, Harrison Ford, Carrie Fisher,
      Billy Dee Williams, Anthony Daniels, David Prowse, Kenny Baker, Peter Mayhew,
      and Frank Oz.", "adce3e560e664fbe90f53bfe49a5b496/t/text/0-653": "Her television
      series The Debbie Reynolds Show earned her a Golden Globe nomination in 1969.
      She starred in the 1973 Broadway revival of the musical Irene, which earned
      her a Tony Award nomination for Best Leading Actress in a Musical. She was also
      nominated for a Daytime Emmy Award for her performance in A Gift of Love (1999).
      After appearing in the popular early-2000s sitcom Will & Grace, Reynolds was
      nominated for a Primetime Emmy Award for Outstanding Guest Actress in a Comedy
      Series for her role as Bobbi, the mother of Grace Adler. Reynolds would reach
      a new, younger audience with her role as Aggie Cromwell in Disney''s Halloweentown
      series.", "ca4c75ab0f14480ba80c4981bb0b231d/t/text/0-365": "In a January 2014
      interview, Fisher confirmed her involvement and the involvement of the original
      cast in the upcoming sequels by saying as for the next Star Wars film, myself,
      Harrison Ford and Mark Hamill are expected to report to work in March or April.
      I''d like to wear my old cinnamon buns hairstyle again but with white hair.
      I think that would be funny. [90]", "52bfb1adcce74cda94c62576b037c4f2/t/text/0-654":
      "In another interview, Fisher revealed that she used cocaine during the filming
      of The Empire Strikes Back. Slowly, I realized I was doing a bit more drugs
      than other people and losing my choice in the matter , she noted.[135] In 1985,
      after months of sobriety, she accidentally overdosed on a combination of prescription
      medication and sleeping pills.[136] She was rushed to the hospital, creating
      the turn of events that led to much of the material in her novel and screenplay,
      Postcards from the Edge. Asked why she did not take on the role of her story''s
      protagonist, named Suzanne, in the film version, Fisher remarked, I''ve already
      played Suzanne. [", "fcce2cee55ff41408b337fca9230b6a4/t/text/0-752": "After
      finishing the European leg of her book tour (her last TV appearance was on an
      episode of 8 Out of 10 Cats in the United Kingdom, which was broadcast on December
      21, 2016), Fisher was on a commercial flight on December 23, 2016, from London
      to Los Angeles when she had a medical emergency around fifteen minutes before
      the aircraft landed.[138][a] A passenger seated near Fisher reported that she
      had stopped breathing;[141] another passenger performed CPR on Fisher until
      paramedics arrived at the scene. Emergency services in Los Angeles were contacted
      when the flight crew reported a passenger unresponsive prior to landing. Fisher
      was taken by ambulance to the Ronald Reagan UCLA Medical Center, where she was
      placed on a ventilator.[142][143]", "01a946a828fe484a8611f995d70a56ee/t/text/0-733":
      "Fisher had a close relationship with English singer-songwriter James Blunt.
      While working on his album Back to Bedlam in 2003, Blunt spent much of his time
      at Fisher''s residence. When Vanity Fair''s George Wayne asked Fisher if their
      relationship was sexual, she replied: Absolutely not, but I did become his therapist.
      He was a soldier. This boy has seen awful stuff. Every time James hears fireworks
      or anything like that, his heart beats faster and he gets ''fight or flight.''
      You know, he comes from a long line of soldiers dating back to the 10th century.
      He would tell me these horrible stories. He was a captain, a reconnaissance
      soldier. I became James'' therapist. So it would have been unethical to sleep
      with my patient. [37]"}}'
