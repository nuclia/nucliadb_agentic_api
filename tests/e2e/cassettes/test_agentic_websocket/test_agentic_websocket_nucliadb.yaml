      {''question'': \"Who is Carrie Fisher''s mother, and what are her notable achievements
      or roles?\"}\n``` Reynolds was married three times. Her first marriage was to
      singer and actor Eddie Fisher in 1955.[71] They became the parents of Carrie
      Fisher and Todd Fisher. The couple divorced in 1959 when it was revealed shortly
      after the death of Elizabeth Taylor''s husband Mike Todd that Fisher had been
      having an affair with her; Taylor and Reynolds were good friends at the time.
      The Eddie Fisher \u2013 Elizabeth Taylor affair was a great public scandal,
