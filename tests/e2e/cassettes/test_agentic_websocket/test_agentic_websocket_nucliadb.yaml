      ask_agent of eb3d0ffc-b5b3-44bc-8469-76054fd1a18f with parameters {''question'':
      ''What are the notable achievements or roles of Debbie Reynolds?''}\n``` Her
      television series The Debbie Reynolds Show earned her a Golden Globe nomination
      in 1969. She starred in the 1973 Broadway revival of the musical Irene, which
      earned her a Tony Award nomination for Best Leading Actress in a Musical. She
      was also nominated for a Daytime Emmy Award for her performance in A Gift of
      Love (1999). After appearing in the popular early-2000s sitcom Will & Grace,
      Reynolds was nominated for a Primetime Emmy Award for Outstanding Guest Actress
      in a Comedy Series for her role as Bobbi, the mother of Grace Adler. Reynolds
      would reach a new, younger audience with her role as Aggie Cromwell in Disney''s
      Halloweentown series. ```\n\n\n## Chunk: Debbie Reynolds\nResult of running:
      ask_agent of eb3d0ffc-b5b3-44bc-8469-76054fd1a18f with parameters {''question'':
      ''What are the notable achievements or roles of Debbie Reynolds?''}\n``` Her
      starring role in The Unsinkable Molly Brown (1964) led to a nomination for the
      Academy Award for Best Actress.[22] Reynolds noted that she initially had issues
      with its director, Charles Walters. He didn''t want me, she said. He wanted
      Shirley MacLaine, who at the time was unable to take the role. He said, ''You
      are totally wrong for the part.'' But six weeks into production, he reversed
      his opinion. He came to me and said, ''I have to admit that I was wrong. You
      are playing the role really well. I''m pleased.'' [23] Reynolds also played
      in Goodbye Charlie, a 1964 comedy film about a callous womanizer who gets his
      just reward. It was adapted from George Axelrod''s play Goodbye, Charlie and
      also starred Tony Curtis and Pat Boone.  ```\n\n\n## Chunk: Debbie Reynolds\nResult
      of running: ask_agent of eb3d0ffc-b5b3-44bc-8469-76054fd1a18f with parameters
      {''question'': ''What are the notable achievements or roles of Debbie Reynolds?''}\n```
      Reynolds was a longtime ally of the LGBT community and an early advocate for
      people with AIDS.[67] In 1983, Reynolds performed at an AIDS fundraiser with
      her friend Shirley MacLaine.[68] In a 2014 interview with The Daily Telegraph,
      Reynolds revealed that she had helped several closeted actors conceal their
      homosexuality by dating them.[69] When asked when she realized she was a gay
      icon, Reynolds replied, Over the years many of the boys that have worked for
      me as dancers have been gay. The creative people were all gay people, from producers
      to writers. To me, they were just family. [ ```\n\n"}], "context": [], "query_context":
