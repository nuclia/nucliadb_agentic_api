      string: "{\"choices\":[{\"delta\":{\"content\":\"\",\"role\":\"assistant\"},\"finish_reason\":\"stop\",\"index\":0,\"message\":{\"content\":\"Here\u2019s
        a simple **Grilled Romaine Caesar Salad** recipe you can make on a grill or
        grill pan.\\n\\n**Ingredients**\\n- 2 romaine hearts, halved lengthwise\\n-
        2 tbsp olive oil\\n- Salt and black pepper\\n- 1 lemon, halved\\n- 1/2 cup
        Caesar dressing, homemade or store-bought\\n- 1/3 cup grated Parmesan\\n-
        1 cup croutons\\n- Optional: grilled chicken, shrimp, or bacon\\n\\n**Instructions**\\n1.
        Preheat the grill to **medium-high**.\\n2. Brush the cut sides of the romaine
        with olive oil and season with salt and pepper.[2][3][13]\\n3. Place the romaine
        halves cut-side down on the grill and cook until lightly charred, about **30
        seconds to 3 minutes**, depending on heat.[2][5][7][13][15]\\n4. Grill the
        lemon halves cut-side down until lightly charred, about **2 to 3 minutes**.[1][5][12]\\n5.
        Remove the romaine and place on a platter.\\n6. Drizzle with Caesar dressing,
        then top with Parmesan and croutons.[1][3][7][12]\\n7. Finish with a squeeze
        of grilled lemon and add optional protein if desired.[1][5][12]\\n\\n**Quick
        dressing option**\\n- Mix Caesar dressing with a little lemon juice and extra
        Parmesan for a brighter flavor.\\n\\n**Tips**\\n- Don\u2019t overcook the
        lettuce; it should be **charred but still crisp**.[1][3][13]\\n- A little
        oil helps the romaine release from the grill and improves browning.[3][11]\\n-
        Serve immediately so the lettuce stays crisp.[3][7]\\n\\nIf you want, I can
        also give you a **from-scratch Caesar dressing recipe** to go with it.\",\"role\":\"assistant\"}}],\"citations\":[\"https://www.vindulge.com/grilled-caesar-salad/\",\"https://www.thedishwithkris.com/easy-lunches/grilled-romaine-caesar-salad\",\"https://familystylefood.com/grilled-romaine-lettuce-caesar-salad/\",\"https://alexandracooks.com/2020/03/06/grilled-romaine-caesar-salad/\",\"https://www.amandafrederickson.com/all-recipes/2018/6/25/grilled-romaine-caesar-salad\",\"https://miciamammas.com/blogs/news/grilled-romaine-caesar-salad\",\"https://townandcountrymarkets.com/recipes/grilled-romaine-caesar\",\"https://itsthyme2cook.com/grilled-romaine-caesar-salad/\",\"https://tasteandsee.com/grilled-romaine-caesar-salad/\",\"https://www.budgetbytes.com/grilled-romaine-caesar-salad/\",\"https://food52.com/recipes/4531-fully-grilled-caesar-salad\",\"https://asador.mx/recipes/grilled-romaine-caesar-salad\",\"https://pamelasalzman.com/grilled-caesar-ish-romaine-salads-recipe/\",\"https://meikoandthedish.com/grilled-romaine-smoky-caesar-dressing/\",\"https://supermancooks.com/grilled-romaine-caesar-salad/\",\"https://healthylittlevittles.com/grilled-romaine-caesar-salad-with-toasted-breadcrumbs/\",\"https://www.foodnetwork.com/recipes/marcela-valladolid/grilled-caesar-salad-3772100\",\"https://themodernproper.com/grilled-romaine-caesar\"],\"created\":1787064925,\"id\":\"dd4a1ac0-3325-4396-bb06-2e927c969376\",\"model\":\"sonar-pro\",\"object\":\"chat.completion\",\"search_results\":[{\"date\":\"2022-06-01\",\"last_updated\":\"2026-08-13\",\"place_metadata\":null,\"snippet\":\"-
