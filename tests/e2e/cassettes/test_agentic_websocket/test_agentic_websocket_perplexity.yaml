    body: '{"question": "Something", "user_id": "", "context": {"8387464bca6f408fbfdbca79a1bc72bb/f/589d7f53b72c45758f94a90bd16e3211/1363-1519":
      "A banana and a loaf of bread. The picture is drawn in brown color with white
      lines on the bananas skin. There are small pieces of bread next to the banana.
      ", "5aeaf6dea66141198c307f913e6e6b99/f/2081015753104886b2536c3ef8ad1f92/1449-1574":
      "A loaf of bread is cut into slices. There are sliced cucumbers next to the
      bread and almonds on the ground in front of them. ", "c5c8c22970d6458c8ed170d386da2688/f/d85166150123490ab51da42681f71e19/967-1134":
      "A drawing of a stack of cookies. The cookie in the middle is round and has
      white frosting on top. There are small pieces of nuts scattered around the pile
      of cookies. ", "c8ba7316fbd74fea98cb39c282881f67/f/05e897bfb9914f3e8056ddc521ac6df5/751-939":
      "A cake is sitting on a wooden board. There are carrots on top of the cake with
      white drizzle dripping down from it. The base of the cake is orange and there
      are small circles around them. ", "99ac6d905f5c4585997cacabe7ea8639/f/38ea6718a3fb435088446379ec381f08/1073-1490":
      "A drawing of a Christmas cake. The candle is lit up and the icing on the top
      of the cake looks like white frosting. There are also red berries decorating
      the base of the cake, as well as two star shaped cookies with snowflakes on
      them. On either side of the candles there are green leaves that look like holly
      branches. At the bottom left corner of the image there is another cookie decorated
      in the shape of a star. ", "f64d6dd68c4d4b27962e0636b76cf7d3/f/3c473649f9044f03aa6c06e0b6da43da/1703-1993":
      "Three chocolate chip cookies are stacked on top of each other. There is a pile
      of small pieces of dark chocolates next to the cookies.  The background behind
      them all black. They look like they have been freshly baked and are golden brown
      in color with chocolate chips scattered throughout.", "c8ba7316fbd74fea98cb39c282881f67/f/05e897bfb9914f3e8056ddc521ac6df5/591-742":
      " \n 8 ounces cream cheese, softened \n 1/2 cup unsalted butter, softened \n
      \n 3 cups powdered sugar \n 1 teaspoon vanilla extract \n \n Pinch of salt \n
      \n \n  ", "c5c8c22970d6458c8ed170d386da2688/f/d85166150123490ab51da42681f71e19/256-530":
      " \n Preheat oven to 375\u00b0F (190\u00b0C). Line baking sheets with parchment
      paper.1. \n In a medium bowl, whisk together flour, baking powder, and salt.2.
      \n In a large bowl, cream together butter and sugar until light and fluffy.
      Beat in \n eggs one at a time, then stir in vanilla. \n", "99ac6d905f5c4585997cacabe7ea8639/f/38ea6718a3fb435088446379ec381f08/0-357":
      " \n Simple Gingerbread Cake \n \n Ingredients: \n \n 1/2 cup granulated sugar
      \n 1/2 cup butter, softened \n \n 1 large egg \n 1 cup unsulphured molasses
