      a wire \n rack to cool completely. \n \n 7. \n \n \n  ", "c5c8c22970d6458c8ed170d386da2688/f/d85166150123490ab51da42681f71e19/967-1134":
      "\n\n\n A drawing of a stack of cookies. The cookie in the middle is round and
