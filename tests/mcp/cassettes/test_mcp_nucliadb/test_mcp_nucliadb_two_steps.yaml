      "NUCLIA", "text": "Agents 2.0: From Shallow Loops to Deep Agents .\n\n Agents
      2.0: From Shallow Loops to Deep Agents\n\n[Image logoPhilschmid](/)\n\nSearch`\u2318k`\n\n[Blog](/)[Projects](/projects)[Newsletter](/cloud-attention)[About
      Me](/philipp-schmid)Toggle Menu\n\n# Agents 2.0: From Shallow Loops to Deep
      Agents\n\nOctober 12, 20255 minute read\n\nFor the past year, building an AI
      agent usually meant one thing: setting up a while loop, take a user prompt,
      send it to an LLM, parse a tool call, execute the tool, send the result back,
      and repeat. This is what we call a Shallow Agent or Agent 1.0.\n\nThis architecture
      is fantastically simple for transactional tasks like \"What''s the weather in
      Tokyo and what should I wear?\", but when asked to perform a task that requires
      50 steps over three days, and they invariably get distracted, lose context,
      enter infinite loops, or hallucinates because the task requires too many steps
      for a single context window.\n\nWe are seeing an architectural shift towards
      [Deep Agents](https://blog.langchain.com/deep-agents/) or Agents 2.0. These
      systems do not just react in a loop. They combine [agentic patterns](https://www.philschmid.de/agentic-pattern)
      to plan, manage a [persistent memory/state](https://www.philschmid.de/memory-in-agents),
      and delegate work to specialized [sub-agents](https://www.philschmid.de/the-rise-of-subagents)
      to solve multi-step, complex problems.\n\nImage overview\n\n## Agents 1.0: The
      Limits of the \"Shallow\" Loop\n\nTo understand where we are going, we must
      understand where we are. Most agents today are \"shallow\". This means rely
      entirely on the LLM''s context window (conversation history) as their state.\n\n1.
      **User Prompt:** \"Find the price of Apple stock and tell me if it''s a good
      buy.\"\n2. **LLM Reason:** \"I need to use a search tool.\"\n3. **Tool Call:**
      `search(\"AAPL stock price\")`\n4. **Observation:** The tool returns data.\n5.
      **LLM Answer:** Generates a response based on the observation or calls another
      tool.\n6. **Repeat:** Loop until done.\n\nThis architecture is stateless and
      ephemeral. The agent''s entire \"brain\" is within the context window. When
      a task becomes complex, e.g. \"Research 10 competitors, analyze their pricing
      models, build a comparison spreadsheet, and write a strategic summary\" it will
      fail due to:\n\n* **Context Overflow:** The history fills up with tool outputs
      (HTML, messy data), pushing instructions out of the context window.\n* **Loss
      of Goal:** Amidst the noise of intermediate steps, the agent forgets the original
      objective.\n* **No Recovery mechanism:** If it goes down a rabbit hole, it rarely
      has the foresight to stop, backtrack, and try a new approach.\n\nShallow agents
      are great at tasks that take 5-15 steps. They are terrible at tasks that take
      500.\n\n## The Architecture of Agents 2.0 (Deep Agents)\n\nDeep Agents decouple
      planning from execution and manage memory external to the context window. The
      architecture consists of four pillars.\n\n### Pillar 1: Explicit Planning\n\nShallow
      agents plan implicitly via chain-of-thought (\"I should do X, then Y\"). Deep
      agents use tools to create and maintain an explicit plan, which can be To-Do
      list in a markdown document.\n\nBetween every step, the agent reviews and updates
      this plan, marking steps as pending, in\\_progress, or completed or add notes.
      If a step fails, it doesn''t just retry blindly, it updates the plan to accommodate
      the failure. This keeps the agent focused on the high-level task.\n\n### Pillar
      2: Hierarchical Delegation (Sub-Agents)\n\nComplex tasks require specialization.
      Shallow Agents tries to be a jack-of-all-trades in one prompt. Deep Agents utilize
      an Orchestrator \u2192 Sub-Agent pattern.\n\nThe Orchestrator delegates task(s)
      to [sub-agent(s)](https://www.philschmid.de/the-rise-of-subagents) each with
      a clean context. The [sub-agent](https://www.philschmid.de/the-rise-of-subagents)
      (e.g., a \"Researcher,\" a \"Coder,\" a \"Writer\") performs its tool call loops
      (searching, erroring, retrying), compiles the final answer, and returns *only*
      the synthesized answer to the Orchestrator.\n\n### Pillar 3: Persistent Memory\n\nTo
      prevent context window overflow, Deep Agents utilize external memory sources,
      like filesystem or vector databases as their source of truth. Frameworks like
      Claude Code and Manus give agents `read`/`write` access to them. An agent writes
      intermediate results (code, draft text, raw data). Subsequent agents reference
      file paths or queries to only retrieve what is necessary. This shifts the paradigm
      from \"remembering everything\" to \"knowing where to find information.\"\n\n###
      Pillar 4: Extreme Context Engineering\n\nSmarter models do not require less
      prompting, they require better context. You cannot get Agent 2.0 behavior with
      a prompt that says, \"You are a helpful AI.\". Deep Agents rely on highly detailed
      instructions sometimes thousands of tokens long. These define:\n\n* Identifying
      when to stop and plan before acting.\n* Protocols for when to spawn a sub-agent
      vs. doing work themselves.\n* Tool definitions and examples on how and when
      to use.\n* Standards for file naming and directory structures.\n* Strict formats
      for human-in-the-loop collaboration.\n\n## Visualizing a Deep Agent Flow\n\nHow
      do these pillars come together? Let''s look at a sequence diagram for a Deep
      Agent handling a complex request: *\"Research Quantum Computing and write a
      summary to a file.\"*\n\nImage sequence\n\n## Conclusion\n\nMoving from Shallow
      Agents to Deep Agents (Agent 1.0 to Agent 2.0) isn''t just about connecting
      an LLM to more tools. It is a shift from reactive loops to proactive architecture.
      It is about better engineering around the model.\n\nImplementing explicit planning,
      hierarchical delegation via [sub-agents](https://www.philschmid.de/the-rise-of-subagents),
      and [persistent memory](https://www.philschmid.de/memory-in-agents), allow us
      to control the context and by controlling the context, we control the complexity,
      unlocking the ability to solve problems that take hours or days, not just seconds.\n\n##
      Acknowledgements\n\nThis overview was created with the help of deep and manual
      research. The term [**\u201cDeep Agents\u201d**](https://blog.langchain.com/deep-agents/)
      was notably popularized by the LangChain team to describe this architectural
      evolution.\n\n---\n\nThanks for reading! If you have any questions or feedback,
      please let me know on [Twitter](https://twitter.com/_philschmid) or [LinkedIn](https://www.linkedin.com/in/philipp-schmid-a6a2bb196/).\n\n*
      [Agents 1.0: The Limits of the \"Shallow\" Loop](#agents-10-the-limits-of-the-shallow-loop)\n*
      [The Architecture of Agents 2.0 (Deep Agents)](#the-architecture-of-agents-20-deep-agents)\n  +
      [Pillar 1: Explicit Planning](#pillar-1-explicit-planning)\n  + [Pillar 2: Hierarchical
      Delegation (Sub-Agents)](#pillar-2-hierarchical-delegation-sub-agents)\n  +
      [Pillar 3: Persistent Memory](#pillar-3-persistent-memory)\n  + [Pillar 4: Extreme
      Context Engineering](#pillar-4-extreme-context-engineering)\n* [Visualizing
      a Deep Agent Flow](#visualizing-a-deep-agent-flow)\n* [Conclusion](#conclusion)\n*
      [Acknowledgements](#acknowledgements)\n\n[Philipp Schmid \u00a9 2025](/philipp-schmid)[Imprint](/imprint)[RSS
      Feed](/rss)\n\ntheme\n\n[Mail](mailto:schmidphilipp1995@gmail.com)[Twitter](https://twitter.com/_philschmid)[LinkedIn](https://www.linkedin.com/in/philipp-schmid-a6a2bb196/)[GitHub](https://github.com/philschmid)Agent
      2.0 Deep Agents)\n\nPlanning\n\nUpdate v7\n\n\\\n| Context\nEngineering\n\\\n\nSub-Agents\n\nOrchestrator\n\n(Specialists)\n\n|
      A\n1\n\nWrite Read\n|\n\nPersistent\n\nMemory \n\n\n A diagram showing the steps
      involved in a project. \n\n\n Main Process Ephemeral Process\n\n1 Orchestrator
      (LLM)\nUser\n\nExternal Memory/State Sub-Agent (Researcher)\n\n\"Research Quantum
      Computing and rite a\n\nUpdate State: Add tasks [Research, Outline, Write]\n\nSpawn(Task=\"Research
      Quantum Computing\")\n\no\u00a3\n\n$earch web, reat docs, filter noige.\n\nReturn
      synthesized summary.\n\nWrite summary to /memory/research_notes.txt\n\nCa\n\nUpdate
      State: Mark \"Research\" as COMPLETE.\n\npines\n\n\"Finished my research and
