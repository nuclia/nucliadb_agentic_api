      ''''\npath: ''''\nsource_id: ''''\nurl: https://www.philschmid.de/agents-2.0-deep-agents\n",
      "72f6d5fe65e5441f97e52e19216460c3/u/link/36432-37155": "#### ACE (ours).\n\nReport
      issue for preceding element\n\nACE optimizes LLM contexts for both offline and
      online adaptation through an agentic context engineering framework.\nTo ensure
      fairness, we use the same LLM for the Generator, Reflector, and Curator (non-thinking
      mode of DeepSeek-V3.1 [[13](https://arxiv.org/html/2510.04618v1#bib.bib13)]),
      preventing knowledge transfer from a stronger Reflector or Curator to a weaker
      Generator.\nThis isolates the benefit of context construction itself.\nWe adopt
      a batch size of 1 (constructing a delta context from each sample).\nWe set the
      maximum number of Reflector refinement rounds and the maximum number of epochs
      in offline adaptation to 5.\n\nReport issue for preceding element\n\nDOCUMENT
      METADATA AT ORIGIN:\nfilename: ''''\npath: ''''\nsource_id: ''''\nurl: https://arxiv.org/html/2510.04618\n",
      "72f6d5fe65e5441f97e52e19216460c3/u/link/30503-33257": "### 4.1 Tasks and Datasets\n\nReport
      issue for preceding element\n\nWe evaluate ACE on two categories of LLM applications
      that benefit most from a comprehensive and evolving context:\n(1) *agent benchmarks*,
      which require multi-turn reasoning, tool use, and environment interaction, where
      agents can accumulate and reuse strategies across episodes and environments;
      and\n(2) *domain-specific benchmarks*, which demand mastery of specialized concepts
      and tactics, where we focus on financial analysis as a case study.\n\nReport
      issue for preceding element\n\n* \u2219\\bullet\n\n  LLM Agent: AppWorld [[43](https://arxiv.org/html/2510.04618v1#bib.bib43)]
      is a suite of autonomous agent tasks involving API understanding, code generation,
      and environment interaction.\n  It provides a realistic execution environment
      with common applications and APIs (e.g., email, file system) and tasks of two
      difficulty levels (normal and challenge).\n  A public leaderboard [[5](https://arxiv.org/html/2510.04618v1#bib.bib5)]
      tracks performance, where, at the time of submission, the best system achieved
      only 60.3% average accuracy, highlighting the benchmark\u2019s difficulty and
      realism.\n\n  Report issue for preceding element\n* \u2219\\bullet\n\n  Financial
      Analysis: FiNER [[33](https://arxiv.org/html/2510.04618v1#bib.bib33)] and Formula
      [[44](https://arxiv.org/html/2510.04618v1#bib.bib44)] test LLMs on financial
      reasoning tasks that rely on the eXtensible Business Reporting Language (XBRL).\n  *FiNER*
      requires labeling tokens in XBRL financial documents with one of 139 fine-grained
      entity types, a key step for financial information extraction in regulated domains.\n  *Formula*
      focuses on extracting values from structured XBRL filings and performing computations
      to answer financial queries, i.e., numerical reasoning.\n\n  Report issue for
      preceding element\n\n#### Evaluation Metrics.\n\nReport issue for preceding
      element\n\nFor AppWorld, we follow the official benchmark protocol and report
      *Task Goal Completion* (TGC) and *Scenario Goal Completion* (SGC) on both the
      test-normal and test-challenge splits.\nFor FiNER and Formula, we follow the
      original setup and report accuracy, measured as the proportion of predicted
      answers that exactly match the ground truth.\n\nReport issue for preceding element\n\nAll
      datasets follow the original train/validation/test splits.\nFor *offline* context
      adaptation, methods are optimized on the training split and evaluated on the
      test split with pass@1 accuracy.\nFor *online* context adaptation, methods are
      evaluated sequentially on the test split: for each sample, the model first predicts
      with the current context, then updates its context based on that sample.\nThe
      same shuffled test split is used across all methods.\n\nReport issue for preceding
      element\n\nDOCUMENT METADATA AT ORIGIN:\nfilename: ''''\npath: ''''\nsource_id:
      ''''\nurl: https://arxiv.org/html/2510.04618\n", "72f6d5fe65e5441f97e52e19216460c3/u/link/53138-53897":
      "### 4.5 Ablation Study\n\nReport issue for preceding element\n\nTable [3](https://arxiv.org/html/2510.04618v1#S4.T3
      \"Table 3 \u2023 4.5 Ablation Study \u2023 4 Results \u2023 Agentic Context
      Engineering: Evolving Contexts for Self-Improving Language Models\") reports
      ablation studies on the AppWorld benchmark, analyzing how individual design
      choices of ACE contribute to effective context adaptation.\nWe examine three
      factors: (1) the Reflector with iterative refinement, our addition to the agentic
      framework beyond Dynamic Cheatsheet, (2) multi-epoch adaptation, which refines
      contexts over training samples multiple times, and (3) offline warmup, which
      initializes the context through offline adaptation before online adaptation
      begins.\n\nReport issue for preceding element\n\nDOCUMENT METADATA AT ORIGIN:\nfilename:
      ''''\npath: ''''\nsource_id: ''''\nurl: https://arxiv.org/html/2510.04618\n",
      "72f6d5fe65e5441f97e52e19216460c3/u/link/51321-53138": "#### Analysis.\n\nReport
      issue for preceding element\n\nAs shown in Table [2](https://arxiv.org/html/2510.04618v1#S4.T2
      \"Table 2 \u2023 4.4 Results on Domain-Specific Benchmark \u2023 4 Results \u2023
      Agentic Context Engineering: Evolving Contexts for Self-Improving Language Models\"),
      ACE delivers strong improvements on financial analysis benchmarks.\nIn the offline
      setting, when provided with ground-truth answers from the training split, ACE
      surpasses ICL, MIPROv2, and GEPA by clear margins (an average of 10.9%), showing
      that structured and evolving contexts are particularly effective when tasks
      require precise domain knowledge (e.g., financial concepts, XBRL rules) that
      goes beyond fixed demonstrations or monolithic optimized prompts.\nIn the online
      setting, ACE continues to exceed prior adaptive methods such as DC by an average
      of 6.2%, further confirming the benefit of agentic context engineering for accumulating
      reusable insights across specialized domains.\n\nReport issue for preceding
      element\n\nMoreover, we also observe that when ground-truth supervision or reliable
      execution signals are absent, both ACE and DC may degrade in performance.\nIn
      such cases, the constructed context can be polluted by spurious or misleading
      signals, highlighting a potential limitation of inference-time adaptation without
      reliable feedback.\nThis suggests that while ACE is robust under rich feedback
      (e.g., code execution results or formula correctness in agent tasks), its effectiveness
      depends on the availability of signals that allow the Reflector and Curator
      to make sound judgments.\nWe return to this limitation in Appendix [B](https://arxiv.org/html/2510.04618v1#A2
      \"Appendix B Limitations and Challenges \u2023 Agentic Context Engineering:
      Evolving Contexts for Self-Improving Language Models\").\n\nReport issue for
      preceding element\n\nDOCUMENT METADATA AT ORIGIN:\nfilename: ''''\npath: ''''\nsource_id:
