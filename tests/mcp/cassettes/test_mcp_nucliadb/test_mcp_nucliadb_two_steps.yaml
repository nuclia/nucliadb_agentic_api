      "c0a5192da40540a8a86c9c1b0114aaee/u/link/0-2729": "Agents 2.0: From Shallow
      Loops to Deep Agents .\n\n Agents 2.0: From Shallow Loops to Deep Agents\n\n[Image
      logoPhilschmid](/)\n\nSearch`\u2318k`\n\n[Blog](/)[Projects](/projects)[Newsletter](/cloud-attention)[About
      Me](/philipp-schmid)Toggle Menu\n\n# Agents 2.0: From Shallow Loops to Deep
      Agents\n\nOctober 12, 20255 minute read\n\nFor the past year, building an AI
      agent usually meant one thing: setting up a while loop, take a user prompt,
      send it to an LLM, parse a tool call, execute the tool, send the result back,
      and repeat. This is what we call a Shallow Agent or Agent 1.0.\n\nThis architecture
      is fantastically simple for transactional tasks like \"What''s the weather in
      Tokyo and what should I wear?\", but when asked to perform a task that requires
      50 steps over three days, and they invariably get distracted, lose context,
      enter infinite loops, or hallucinates because the task requires too many steps
      for a single context window.\n\nWe are seeing an architectural shift towards
      [Deep Agents](https://blog.langchain.com/deep-agents/) or Agents 2.0. These
      systems do not just react in a loop. They combine [agentic patterns](https://www.philschmid.de/agentic-pattern)
      to plan, manage a [persistent memory/state](https://www.philschmid.de/memory-in-agents),
      and delegate work to specialized [sub-agents](https://www.philschmid.de/the-rise-of-subagents)
      to solve multi-step, complex problems.\n\nImage overview\n\n## Agents 1.0: The
      Limits of the \"Shallow\" Loop\n\nTo understand where we are going, we must
      understand where we are. Most agents today are \"shallow\". This means rely
      entirely on the LLM''s context window (conversation history) as their state.\n\n1.
      **User Prompt:** \"Find the price of Apple stock and tell me if it''s a good
      buy.\"\n2. **LLM Reason:** \"I need to use a search tool.\"\n3. **Tool Call:**
      `search(\"AAPL stock price\")`\n4. **Observation:** The tool returns data.\n5.
      **LLM Answer:** Generates a response based on the observation or calls another
      tool.\n6. **Repeat:** Loop until done.\n\nThis architecture is stateless and
      ephemeral. The agent''s entire \"brain\" is within the context window. When
      a task becomes complex, e.g. \"Research 10 competitors, analyze their pricing
      models, build a comparison spreadsheet, and write a strategic summary\" it will
      fail due to:\n\n* **Context Overflow:** The history fills up with tool outputs
      (HTML, messy data), pushing instructions out of the context window.\n* **Loss
      of Goal:** Amidst the noise of intermediate steps, the agent forgets the original
      objective.\n* **No Recovery mechanism:** If it goes down a rabbit hole, it rarely
      has the foresight to stop, backtrack, and try a new approach.\n\nShallow agents
      are great at tasks that take 5-15 steps. They are terrible at tasks that take
      500.\n\nDOCUMENT METADATA AT ORIGIN:\nfilename: ''''\npath: ''''\nsource_id:
      ''''\nurl: https://www.philschmid.de/agents-2.0-deep-agents\n", "72f6d5fe65e5441f97e52e19216460c3/u/link/24645-25767":
      "Figure 4: The ACE Framework. Inspired by Dynamic Cheatsheet, ACE adopts an
      agentic architecture with three specialized components: a Generator, a Reflector,
      and a Curator.\n\nReport issue for preceding element\n\nAs shown in Figure [4](https://arxiv.org/html/2510.04618v1#S3.F4
      \"Figure 4 \u2023 3 Agentic Context Engineering (ACE) \u2023 Agentic Context
      Engineering: Evolving Contexts for Self-Improving Language Models\"), the workflow
      begins with the Generator producing reasoning trajectories for new queries,
      which surface both effective strategies and recurring pitfalls.\nThe Reflector
      critiques these traces to extract lessons, optionally refining them across multiple
      iterations.\nThe Curator then synthesizes these lessons into compact *delta
      entries*, which are merged deterministically into the existing context by lightweight,
      non-LLM logic.\nBecause updates are itemized and localized, multiple deltas
      can be merged in parallel, enabling batched adaptation at scale.\nACE further
      supports multi-epoch adaptation, where the same queries are revisited to progressively
      strengthen the context.\n\nReport issue for preceding element\n\nDOCUMENT METADATA
      AT ORIGIN:\nfilename: ''''\npath: ''''\nsource_id: ''''\nurl: https://arxiv.org/html/2510.04618\n",
      "72f6d5fe65e5441f97e52e19216460c3/u/link/14743-17404": "To address these limitations,
      we introduce ACE (Agentic Context Engineering), a framework for comprehensive
      context adaptation in both offline settings (e.g., system prompt optimization)
      and online settings (e.g., test-time memory adaptation).\nRather than compressing
      contexts into distilled summaries, ACE treats them as evolving playbooks that
      accumulate and organize strategies over time.\nBuilding on the agentic architecture
      of Dynamic Cheatsheet [[41](https://arxiv.org/html/2510.04618v1#bib.bib41)],
      ACE incorporates a modular workflow of generation, reflection, and curation,
      while adding structured, incremental updates guided by a grow-and-refine principle.\nThis
      design preserves detailed, domain-specific knowledge, prevents context collapse,
      and yields contexts that remain comprehensive and scalable throughout adaptation.\n\nReport
      issue for preceding element\n\nWe evaluate ACE on two categories of LLM applications
      that most benefit from comprehensive, evolving contexts:\n(1) *agents* [[43](https://arxiv.org/html/2510.04618v1#bib.bib43)],
      which require multi-turn reasoning, tool use, and environment interaction, where
      accumulated strategies can be reused across episodes; and\n(2) *domain-specific
      benchmarks*, which demand specialized tactics and knowledge, where we focus
      on financial analysis [[33](https://arxiv.org/html/2510.04618v1#bib.bib33),
      [44](https://arxiv.org/html/2510.04618v1#bib.bib44)].\nOur key findings are:\n\nReport
      issue for preceding element\n\n* \u2219\\bullet\n\n  ACE consistently outperforms
      strong baselines, yielding average gains of 10.6% on agents and 8.6% on domain-specific
      benchmarks, across both offline and online adaptation settings.\n\n  Report
      issue for preceding element\n* \u2219\\bullet\n\n  ACE is able to construct
      effective contexts without labeled supervision, instead leveraging execution
      feedback and environment signals\u2014key ingredients for self-improving LLMs
      and agents.\n\n  Report issue for preceding element\n* \u2219\\bullet\n\n  On
      the AppWorld benchmark leaderboard [[5](https://arxiv.org/html/2510.04618v1#bib.bib5)],
      ACE matches the top-ranked production-level agent IBM-CUGA [[35](https://arxiv.org/html/2510.04618v1#bib.bib35)]
      (powered by GPT-4.1) on average and surpasses it on the harder test-challenge
      split, while using a smaller open-source model (DeepSeek-V3.1).\n\n  Report
      issue for preceding element\n* \u2219\\bullet\n\n  ACE requires significantly
      fewer rollouts and lower dollar costs, and achieves 86.9% lower adaptation latency
      (on average) than existing adaptive methods, demonstrating that scalable self-improvement
      can be achieved with both higher accuracy and lower overhead.\n\n  Report issue
      for preceding element\n\nDOCUMENT METADATA AT ORIGIN:\nfilename: ''''\npath:
      ''''\nsource_id: ''''\nurl: https://arxiv.org/html/2510.04618\n", "72f6d5fe65e5441f97e52e19216460c3/u/link/28383-30503":
      "## 4 Results\n\nReport issue for preceding element\n\nOur evaluation of ACE
      shows that:\n\nReport issue for preceding element\n\n* \u2219\\bullet\n\n  Enabling
      High-Performance, Self-Improving Agents. ACE enables agents to self-improve
      by dynamically refining their input context. It boosts accuracy on the AppWorld
      benchmark by up to 17.1% by learning to engineer better contexts from execution
      feedback alone, without needing ground-truth labels. This context-driven improvement
      allows a smaller, open-source model to match the performance of the top-ranked
      proprietary agent on the leaderboard. (\u00a7[4.3](https://arxiv.org/html/2510.04618v1#S4.SS3
      \"4.3 Results on Agent Benchmark \u2023 4 Results \u2023 Agentic Context Engineering:
      Evolving Contexts for Self-Improving Language Models\"))\n\n  Report issue for
      preceding element\n* \u2219\\bullet\n\n  Large Gains on Domain-Specific Benchmarks.
      On complex financial reasoning benchmarks, ACE delivers an average performance
      gain of 8.6% over strong baselines by constructing comprehensive playbooks with
      domain-specific concepts and insights. (\u00a7[4.4](https://arxiv.org/html/2510.04618v1#S4.SS4
      \"4.4 Results on Domain-Specific Benchmark \u2023 4 Results \u2023 Agentic Context
      Engineering: Evolving Contexts for Self-Improving Language Models\"))\n\n  Report
      issue for preceding element\n* \u2219\\bullet\n\n  Effective by Design. Ablation
      studies confirm our design choices are key to success, with components like
      the Reflector and multi-epoch refinement each contributing substantial performance
      gains. (\u00a7[4.5](https://arxiv.org/html/2510.04618v1#S4.SS5 \"4.5 Ablation
      Study \u2023 4 Results \u2023 Agentic Context Engineering: Evolving Contexts
      for Self-Improving Language Models\"))\n\n  Report issue for preceding element\n*
      \u2219\\bullet\n\n  Lower Cost and Adaptation Latency. ACE achieves these gains
      efficiently, reducing adaptation latency by 86.9% on average, while requiring
      fewer rollouts and lower token dollar costs. (\u00a7[4.6](https://arxiv.org/html/2510.04618v1#S4.SS6
      \"4.6 Cost and Speed Analysis \u2023 4 Results \u2023 Agentic Context Engineering:
      Evolving Contexts for Self-Improving Language Models\"))\n\n  Report issue for
      preceding element\n\nDOCUMENT METADATA AT ORIGIN:\nfilename: ''''\npath: ''''\nsource_id:
      ''''\nurl: https://arxiv.org/html/2510.04618\n", "72f6d5fe65e5441f97e52e19216460c3/u/link/43751-46057":
      "### 4.3 Results on Agent Benchmark\n\nReport issue for preceding element\n\n####
      Analysis.\n\nReport issue for preceding element\n\nAs shown in Table [1](https://arxiv.org/html/2510.04618v1#S4.T1
      \"Table 1 \u2023 ACE (ours). \u2023 4.2 Baselines and Methods \u2023 4 Results
      \u2023 Agentic Context Engineering: Evolving Contexts for Self-Improving Language
      Models\"), ACE consistently improves over strong baselines on the AppWorld benchmark.\nIn
      the offline setting, ReAct + ACE outperforms both ReAct + ICL and ReAct + GEPA
      by significant margins (12.3% and 11.9%, respectively), demonstrating that structured,
      evolving, and detailed contexts enable more effective agent learning than fixed
      demonstrations or single optimized instruction prompts.\nThese gains extend
      to the online setting, where ACE continues to outperform prior adaptive methods
      such as Dynamic Cheatsheet by an average of 7.6%.\n\nReport issue for preceding
      element\n\nIn the agent use case, ACE remains effective even without access
      to ground-truth labels during adaptation: ReAct + ACE achieves an average improvement
      of 14.8% over the ReAct baseline in this setting.\nThis robustness arises because
      ACE leverages signals naturally available during execution (e.g., code execution
      success or failure) to guide the Reflector and Curator in forming structured
      lessons of successes and failures.\nTogether, these results establish ACE as
      a strong and versatile framework for building self-improving agents that adapt
      reliably both with and without labeled supervision.\n\nReport issue for preceding
      element\n\nNotably, on the latest AppWorld leaderboard (as of September 20,
      2025; Figure [5](https://arxiv.org/html/2510.04618v1#A3.F5 \"Figure 5 \u2023
      Appendix C AppWorld Leaderboard Snapshot (09/2025) \u2023 Agentic Context Engineering:
      Evolving Contexts for Self-Improving Language Models\")), on average, ReAct
      + ACE (59.4%) matches the top-ranked IBM CUGA (60.3%), a production-level GPT-4.1\u2013based
      agent [[35](https://arxiv.org/html/2510.04618v1#bib.bib35)], despite using the
      smaller open-source model DeepSeek-V3.1.\nWith online adaptation, ReAct + ACE
      even surpasses IBM CUGA by 8.4% in TGC and 0.7% in SGC on the harder test-challenge
      split, underscoring the effectiveness of ACE in building comprehensive and self-evolving
      contexts for agents.\n\nReport issue for preceding element\n\nDOCUMENT METADATA
      AT ORIGIN:\nfilename: ''''\npath: ''''\nsource_id: ''''\nurl: https://arxiv.org/html/2510.04618\n",
      "72f6d5fe65e5441f97e52e19216460c3/u/link/11763-14743": "Despite this progress,
      existing approaches to context adaptation face two key limitations.\nFirst,
      a brevity bias: many prompt optimizers prioritize concise, broadly applicable
      instructions over comprehensive accumulation.\nFor example, GEPA [[4](https://arxiv.org/html/2510.04618v1#bib.bib4)]
      highlights brevity as a strength, but such abstraction can omit domain-specific
      heuristics, tool-use guidelines, or common failure modes that matter in practice
      [[16](https://arxiv.org/html/2510.04618v1#bib.bib16)].\nThis objective aligns
      with validation metrics in some settings, but often fails to capture the detailed
      strategies required by agents and knowledge-intensive applications.\nSecond,
      context collapse: methods that rely on monolithic rewriting by an LLM often
      degrade into shorter, less informative summaries over time, causing sharp performance
      declines (Figure [2](https://arxiv.org/html/2510.04618v1#S2.F2 \"Figure 2 \u2023
      The Brevity Bias. \u2023 2.2 Limitations of Existing Context Adaptation Methods
      \u2023 2 Background and Motivation \u2023 Agentic Context Engineering: Evolving
      Contexts for Self-Improving Language Models\")).\nIn domains such as interactive
      agents [[43](https://arxiv.org/html/2510.04618v1#bib.bib43), [38](https://arxiv.org/html/2510.04618v1#bib.bib38),
      [57](https://arxiv.org/html/2510.04618v1#bib.bib57)], domain-specific programming
      [[53](https://arxiv.org/html/2510.04618v1#bib.bib53), [56](https://arxiv.org/html/2510.04618v1#bib.bib56)],
      and financial or legal analysis [[33](https://arxiv.org/html/2510.04618v1#bib.bib33),
      [18](https://arxiv.org/html/2510.04618v1#bib.bib18), [44](https://arxiv.org/html/2510.04618v1#bib.bib44)],
      strong performance depends on retaining detailed, task-specific knowledge rather
      than compressing it away.\n\nReport issue for preceding element\n\nAs applications
      such as agents and knowledge-intensive reasoning demand greater reliability,
      recent work has shifted toward saturating contexts with abundant, potentially
      useful information [[22](https://arxiv.org/html/2510.04618v1#bib.bib22), [12](https://arxiv.org/html/2510.04618v1#bib.bib12),
      [11](https://arxiv.org/html/2510.04618v1#bib.bib11)], enabled by advances in
      long-context LLMs [[39](https://arxiv.org/html/2510.04618v1#bib.bib39), [34](https://arxiv.org/html/2510.04618v1#bib.bib34)].\nWe
      argue that contexts should function not as concise summaries, but as comprehensive,
      evolving playbooks\u2014detailed, inclusive, and rich with domain insights.\nUnlike
      humans, who often benefit from concise generalization, LLMs are more effective
      when provided with long, detailed contexts and can distill relevance autonomously
      [[22](https://arxiv.org/html/2510.04618v1#bib.bib22), [31](https://arxiv.org/html/2510.04618v1#bib.bib31),
      [41](https://arxiv.org/html/2510.04618v1#bib.bib41)].\nThus, instead of compressing
      away domain-specific heuristics and tactics, contexts should preserve them,
      allowing the model to decide what matters at inference time.\n\nReport issue
      for preceding element\n\nDOCUMENT METADATA AT ORIGIN:\nfilename: ''''\npath:
      ''''\nsource_id: ''''\nurl: https://arxiv.org/html/2510.04618\n", "72f6d5fe65e5441f97e52e19216460c3/u/link/9394-11763":
      "## 1 Introduction\n\nReport issue for preceding element\nImage Refer to caption\n\nFigure
      1: Overall Performance Results. Our proposed framework, ACE, consistently outperforms
      strong baselines across agent and domain-specific reasoning tasks.\n\nReport
      issue for preceding element\n\nModern AI applications based on large language
      models (LLMs), such as LLM agents [[52](https://arxiv.org/html/2510.04618v1#bib.bib52),
      [49](https://arxiv.org/html/2510.04618v1#bib.bib49)] and compound AI systems
      [[55](https://arxiv.org/html/2510.04618v1#bib.bib55)], increasingly depend on
      context adaptation.\nInstead of modifying model weights, context adaptation
      improves performance after model training by incorporating clarified instructions,
      structured reasoning steps, or domain-specific input formats directly into the
      model\u2019s inputs.\nContexts underpin many AI system components, including
      system prompts that guide downstream tasks [[36](https://arxiv.org/html/2510.04618v1#bib.bib36),
      [4](https://arxiv.org/html/2510.04618v1#bib.bib4)], memory that carries past
      facts and experiences [[41](https://arxiv.org/html/2510.04618v1#bib.bib41),
      [48](https://arxiv.org/html/2510.04618v1#bib.bib48)], and factual evidence that
      reduces hallucination and supplements knowledge [[6](https://arxiv.org/html/2510.04618v1#bib.bib6)].\n\nReport
      issue for preceding element\n\nAdapting through contexts rather than weights
      offers several key advantages.\nContexts are interpretable and explainable for
      users and developers [[47](https://arxiv.org/html/2510.04618v1#bib.bib47), [45](https://arxiv.org/html/2510.04618v1#bib.bib45)],
      allow rapid integration of new knowledge at runtime [[27](https://arxiv.org/html/2510.04618v1#bib.bib27),
      [7](https://arxiv.org/html/2510.04618v1#bib.bib7)], and can be shared across
      models or modules in a compound system [[23](https://arxiv.org/html/2510.04618v1#bib.bib23)].\nMeanwhile,
      advances in long-context LLMs [[39](https://arxiv.org/html/2510.04618v1#bib.bib39)]
      and context-efficient inference such as KV cache reuse [[17](https://arxiv.org/html/2510.04618v1#bib.bib17),
      [51](https://arxiv.org/html/2510.04618v1#bib.bib51)] are making context-based
      approaches increasingly practical for deployment.\nAs a result, context adaptation
      is emerging as a central paradigm for building capable, scalable, and self-improving
      AI systems.\n\nReport issue for preceding element\n\nDOCUMENT METADATA AT ORIGIN:\nfilename:
      ''''\npath: ''''\nsource_id: ''''\nurl: https://arxiv.org/html/2510.04618\n",
      "72f6d5fe65e5441f97e52e19216460c3/u/link/75445-77590": "## Appendix A Related
      Work on Agent Memory\n\nReport issue for preceding element\n\nA growing body
      of work explores how agents can accumulate experience from past trajectories
      and leverage external (often non-parametric) memory to guide future actions.\nAgentFly
      [[59](https://arxiv.org/html/2510.04618v1#bib.bib59)] presents an extensible
      framework where memory evolves continuously as agents solve tasks, enabling
      scalable reinforcement learning and long-horizon reasoning across diverse environments.\nAWM
      (Agent Workflow Memory) [[46](https://arxiv.org/html/2510.04618v1#bib.bib46)]
      induces reusable *workflows*\u2014structured routines distilled from past trajectories\u2014and
      selectively injects them into memory to improve efficiency and generalization
      in web navigation benchmarks.\nA-MEM [[48](https://arxiv.org/html/2510.04618v1#bib.bib48)]
      introduces a dynamically organized memory system inspired by the Zettelkasten
      method: each stored memory is annotated with structured attributes (e.g., tags,
      keywords, contextual descriptions) and automatically linked to relevant past
      entries, while existing entries are updated to integrate new knowledge, yielding
      adaptive and context-aware retrieval.\nAgentic Plan Caching [[58](https://arxiv.org/html/2510.04618v1#bib.bib58)]
      instead focuses on cost efficiency by extracting reusable plan templates from
      agent trajectories and caching them for fast execution at test time.\n\nReport
      issue for preceding element\n\nTogether, these works demonstrate the value of
      external memory for improving adaptability, efficiency, and generalization in
      LLM agents.\nOur work differs by tackling the broader challenge of *context
      adaptation*, which spans not only agent memory but also system prompts, factual
      evidence, and other inputs underpinning AI systems.\nWe further highlight two
      fundamental limitations of existing adaptation methods\u2014brevity bias and
      context collapse\u2014and show that addressing them is essential for robustness,
      reliability, and scalability beyond raw task performance.\nAccordingly, our
      evaluation considers not only accuracy but also cost, latency, and scalability.\n\nReport
      issue for preceding element\n\nDOCUMENT METADATA AT ORIGIN:\nfilename: ''''\npath:
      ''''\nsource_id: ''''\nurl: https://arxiv.org/html/2510.04618\n", "72f6d5fe65e5441f97e52e19216460c3/u/link/7215-9394":
      "# Agentic Context Engineering: Evolving Contexts for Self-Improving Language
      Models\n\nReport issue for preceding element\n\nQizheng Zhang 1\u2217\n\u2003Changran
      Hu 2\u2217\n\u2003Shubhangi Upasani 2\n\u2003Boyuan Ma 2\n\u2003Fenglu Hong
      2\n  \nVamsidhar Kamanuru 2\n\u2003Jay Rainton 2\n\u2003Chen Wu 2\n\u2003Mengmeng
      Ji 2\n\u2003Hanchen Li 3\n  \nUrmish Thakker 2\n\u2003James Zou 1\n\u2003Kunle
      Olukotun 1\n  \n1 Stanford University \u20032 SambaNova Systems, Inc. \u20033
      UC Berkeley \u2003\u2217 equal contribution\n  \n#\u2002qizhengz@stanford.edu,
      changran.hu@sambanovasystems.com\n\nReport issue for preceding element\n\n######
      Abstract\n\nReport issue for preceding element\n\nLarge language model (LLM)
      applications such as agents and domain-specific reasoning increasingly rely
      on *context adaptation*\u2014modifying inputs with instructions, strategies,
      or evidence, rather than weight updates.\nPrior approaches improve usability
      but often suffer from brevity bias, which drops domain insights for concise
      summaries, and from context collapse, where iterative rewriting erodes details
      over time.\nBuilding on the adaptive memory introduced by Dynamic Cheatsheet,
      we introduce ACE (Agentic Context Engineering), a framework that treats contexts
      as evolving playbooks that accumulate, refine, and organize strategies through
      a modular process of generation, reflection, and curation.\nACE prevents collapse
      with structured, incremental updates that preserve detailed knowledge and scale
      with long-context models.\nAcross agent and domain-specific benchmarks, ACE
      optimizes contexts both offline (e.g., system prompts) and online (e.g., agent
      memory), consistently outperforming strong baselines: +10.6% on agents and +8.6%
      on finance, while significantly reducing adaptation latency and rollout cost.\nNotably,
      ACE could adapt effectively without labeled supervision and instead by leveraging
      natural execution feedback.\nOn the AppWorld leaderboard, ACE matches the top-ranked
      production-level agent on the overall average and surpasses it on the harder
      test-challenge split, despite using a smaller open-source model.\nThese results
      show that comprehensive, evolving contexts enable scalable, efficient, and self-improving
      LLM systems with low overhead.\n\nReport issue for preceding element\n\nDOCUMENT
