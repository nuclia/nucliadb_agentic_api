      of papers, and your feedback helps enhance accessibility and mobile support.
      To report errors in the HTML that will help us improve conversion and rendering,
      choose any of the methods listed below:\n\n* Click the \"Report Issue\" button.\n*
      Open a report feedback form via keyboard, use \"**Ctrl + ?**\".\n* Make a text
      selection and click the \"Report Issue for Selection\" button near your cursor.\n*
      You can use Alt+Y to toggle on and Alt+Shift+Y to toggle off accessible reporting
      links at each section.\n\nOur team has already identified [the following issues](https://github.com/arXiv/html_feedback/issues).
      We appreciate your time reviewing and reporting rendering errors we may not
      have found yet. Your efforts will help us improve the HTML versions for all
      readers, because disability should not be a barrier to accessing research. Thank
      you for your continued support in championing open access for all.\n\nHave a
      free development cycle? Help support accessibility at arXiv! Our collaborators
      at LaTeXML maintain a [list of packages that need conversion](https://github.com/brucemiller/LaTeXML/wiki/Porting-LaTeX-packages-for-LaTeXML),
      and welcome [developer contributions](https://github.com/brucemiller/LaTeXML/issues).\n\nDOCUMENT
