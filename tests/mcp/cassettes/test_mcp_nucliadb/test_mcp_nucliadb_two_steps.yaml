      {"author": "NUCLIA", "text": "Tool search_documents executed"}, {"author": "NUCLIA",
      "text": "## The Architecture of Agents 2.0 (Deep Agents)\n\nDeep Agents decouple
      planning from execution and manage memory external to the context window. The
      architecture consists of four pillars.\n\n### Pillar 1: Explicit Planning\n\nShallow
      agents plan implicitly via chain-of-thought (\"I should do X, then Y\"). Deep
      agents use tools to create and maintain an explicit plan, which can be To-Do
      list in a markdown document.\n\nBetween every step, the agent reviews and updates
      this plan, marking steps as pending, in\\_progress, or completed or add notes.
      If a step fails, it doesn''t just retry blindly, it updates the plan to accommodate
      the failure. This keeps the agent focused on the high-level task.\n\n### Pillar
      2: Hierarchical Delegation (Sub-Agents)\n\nComplex tasks require specialization.
      Shallow Agents tries to be a jack-of-all-trades in one prompt. Deep Agents utilize
      an Orchestrator \u2192 Sub-Agent pattern.\n\nThe Orchestrator delegates task(s)
      to [sub-agent(s)](https://www.philschmid.de/the-rise-of-subagents) each with
      a clean context. The [sub-agent](https://www.philschmid.de/the-rise-of-subagents)
      (e.g., a \"Researcher,\" a \"Coder,\" a \"Writer\") performs its tool call loops
      (searching, erroring, retrying), compiles the final answer, and returns *only*
      the synthesized answer to the Orchestrator.\n\n### Pillar 3: Persistent Memory\n\nTo
      prevent context window overflow, Deep Agents utilize external memory sources,
      like filesystem or vector databases as their source of truth. Frameworks like
      Claude Code and Manus give agents `read`/`write` access to them. An agent writes
      intermediate results (code, draft text, raw data). Subsequent agents reference
      file paths or queries to only retrieve what is necessary. This shifts the paradigm
      from \"remembering everything\" to \"knowing where to find information.\"\n\n###
      Pillar 4: Extreme Context Engineering\n\nSmarter models do not require less
      prompting, they require better context. You cannot get Agent 2.0 behavior with
      a prompt that says, \"You are a helpful AI.\". Deep Agents rely on highly detailed
      instructions sometimes thousands of tokens long. These define:\n\n* Identifying
      when to stop and plan before acting.\n* Protocols for when to spawn a sub-agent
      vs. doing work themselves.\n* Tool definitions and examples on how and when
      to use.\n* Standards for file naming and directory structures.\n* Strict formats
      for human-in-the-loop collaboration.\n\nDOCUMENT METADATA AT ORIGIN:\nfilename:
      ''''\npath: ''''\nsource_id: ''''\nurl: https://www.philschmid.de/agents-2.0-deep-agents\n\nMetadata:
