      METADATA AT ORIGIN:\nfilename: ''''\npath: ''''\nsource_id: ''''\nurl: https://arxiv.org/html/2510.04618\n",
      "72f6d5fe65e5441f97e52e19216460c3/u/link/58089-59892": "### 4.6 Cost and Speed
      Analysis\n\nReport issue for preceding element\n\n| Method | Latency (s)\u2193\\downarrow
      | # Rollouts\u2193\\downarrow |\n| --- | --- | --- |\n| ReAct + GEPA | 53898
      | 1434 |\n| ReAct + ACE | 9517(-82.3%) | 357(-75.1%) |\n\n(a) Offline (AppWorld).\n\nReport
      issue for preceding element\n\n| Method | Latency (s)\u2193\\downarrow | Token
      Cost ($)\u2193\\downarrow |\n| --- | --- | --- |\n| DC (CU) | 65104 | 17.7 |\n|
      ACE | 5503(-91.5%) | 2.9(-83.6%) |\n\n(b) Online (FiNER).\n\nReport issue for
      preceding element\n\nTable 4: Cost and Speed Analysis. We measure the context
      adaptation latency, number of rollouts, and dollar costs of ACE against GEPA
      (offline) and DC (online).\n\nReport issue for preceding element\n\nDue to its
      support for incremental, \u201cdelta\" context updates and non-LLM-based context
      merging and de-duplication, ACE demonstrates particular advantages in reducing
      the cost (in terms of the number of rollouts or the amount of dollar cost for
      token ingestion/generation) and latency of adaptation.\n\nReport issue for preceding
      element\n\nAs examples, on the offline adaptation of AppWorld, ACE achieves
      82.3% reduction in adaptation latency and 75.1% reduction in the number of rollouts
      as compared to GEPA (Table [4](https://arxiv.org/html/2510.04618v1#S4.T4 \"Table
      4 \u2023 4.6 Cost and Speed Analysis \u2023 4 Results \u2023 Agentic Context
      Engineering: Evolving Contexts for Self-Improving Language Models\")(a)).\nOn
      the online adaptation of FiNER, ACE achieves 91.5% reduction in adaptation latency
      and 83.6% reduction in token dollar cost for token ingestion and generation
      as compared to DC (Table [4](https://arxiv.org/html/2510.04618v1#S4.T4 \"Table
      4 \u2023 4.6 Cost and Speed Analysis \u2023 4 Results \u2023 Agentic Context
      Engineering: Evolving Contexts for Self-Improving Language Models\")(b)).\n\nReport
      issue for preceding element\n\n\n\nDOCUMENT METADATA AT ORIGIN:\nfilename: ''''\npath:
      ''''\nsource_id: ''''\nurl: https://arxiv.org/html/2510.04618\n", "72f6d5fe65e5441f97e52e19216460c3/u/link/59892-62492":
      "## 5 Discussion\n\nReport issue for preceding element\n\n#### Longer Context
      \u2260\\neq Higher Serving Cost.\n\nReport issue for preceding element\n\nAlthough
      ACE produces longer contexts than methods such as GEPA, this does not translate
      to linearly higher inference cost or GPU memory usage.\nModern serving infrastructures
      are increasingly optimized for long-context workloads through techniques such
      as the reuse [[17](https://arxiv.org/html/2510.04618v1#bib.bib17), [51](https://arxiv.org/html/2510.04618v1#bib.bib51)],
      compression [[32](https://arxiv.org/html/2510.04618v1#bib.bib32), [30](https://arxiv.org/html/2510.04618v1#bib.bib30)],
      and offload [[25](https://arxiv.org/html/2510.04618v1#bib.bib25)] of KV cache.\nThese
      mechanisms allow frequently reused context segments to be cached locally or
      remotely, avoiding repetitive and expensive prefill operations.\nOngoing advances
      in ML systems suggest that the amortized cost of handling long contexts will
      continue to decrease, making context-rich approaches like ACE increasingly practical
      in deployment.\n\nReport issue for preceding element\n\n#### Implications for
      Online and Continuous Learning.\n\nReport issue for preceding element\n\nOnline
      and continuous learning are key research directions in machine learning for
      addressing issues like distribution shifts [[24](https://arxiv.org/html/2510.04618v1#bib.bib24),
      [19](https://arxiv.org/html/2510.04618v1#bib.bib19)] and limited training data
      [[37](https://arxiv.org/html/2510.04618v1#bib.bib37), [21](https://arxiv.org/html/2510.04618v1#bib.bib21),
      [60](https://arxiv.org/html/2510.04618v1#bib.bib60)].\nACE offers a flexible
      and efficient alternative to conventional model fine-tuning, as adapting contexts
      is generally cheaper than updating model weights [[9](https://arxiv.org/html/2510.04618v1#bib.bib9),
      [26](https://arxiv.org/html/2510.04618v1#bib.bib26), [28](https://arxiv.org/html/2510.04618v1#bib.bib28),
      [20](https://arxiv.org/html/2510.04618v1#bib.bib20)].\nMoreover, because contexts
      are human-interpretable, ACE enables selective unlearning [[10](https://arxiv.org/html/2510.04618v1#bib.bib10),
      [8](https://arxiv.org/html/2510.04618v1#bib.bib8), [29](https://arxiv.org/html/2510.04618v1#bib.bib29)]\u2014whether
      due to privacy or legal constraints [[1](https://arxiv.org/html/2510.04618v1#bib.bib1),
      [2](https://arxiv.org/html/2510.04618v1#bib.bib2)], or when outdated or incorrect
      information is identified by domain experts.\nThese are promising directions
      for future work, where ACE could play a central role in advancing continuous
      and responsible learning.\n\nReport issue for preceding element\n\n\n\nDOCUMENT
