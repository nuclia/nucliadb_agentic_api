      {"author": "NUCLIA", "text": "The architecture of Agents 2.0, also known as
      Deep Agents, is built on four main pillars:\n\n1. **Explicit Planning**: Deep
      Agents separate planning from execution by maintaining an explicit plan, such
      as a to-do list in a markdown document. The agent reviews and updates this plan
      between every step, marking tasks as pending, in progress, or completed, and
      adding notes as needed. If a step fails, the plan is updated to accommodate
      the failure, rather than simply retrying blindly.\n\n2. **Hierarchical Delegation
      (Sub-Agents)**: Instead of handling all tasks in a single prompt, Deep Agents
      use an Orchestrator \u2192 Sub-Agent pattern. The Orchestrator delegates tasks
      to specialized sub-agents (e.g., \"Researcher,\" \"Coder,\" \"Writer\"), each
      with a clean context. Sub-agents perform their work and return only the synthesized
      answer to the Orchestrator.\n\n3. **Persistent Memory**: To avoid context window
      overflow, Deep Agents use external memory sources (like filesystems or vector
      databases) as their source of truth. Agents write intermediate results to this
      memory, and subsequent agents retrieve only what is necessary, shifting from
      \"remembering everything\" to \"knowing where to find information.\"\n\n4. **Extreme
      Context Engineering**: Deep Agents rely on highly detailed instructions, sometimes
      thousands of tokens long, which define when to plan, when to delegate, tool
      usage protocols, file naming standards, and collaboration formats. This detailed
      context is essential for achieving Agent 2.0 behavior and managing complex,
      long-horizon tasks[1].\n\nThis architecture enables Deep Agents to move beyond
      the limitations of \"shallow\" agents, allowing them to solve complex, multi-step
      problems by proactively managing plans, memory, and context[1].\n\n[1]: block-AA\n\nDocument
