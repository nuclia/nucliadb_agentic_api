      |\n\nTable 2: Results on Financial Analysis Benchmark. \"GT labels\" indicates
      whether ground-truth labels are available to the Reflector during adaptation.
      With GT labels, ACE outperforms selected baselines by an average of 8.6%, highlighting
      the advantage of structured and evolving contexts for domain-specific reasoning.
      However, we also observe that in the absence of reliable feedback signals (e.g.,
      ground-truth labels or execution outcomes), both ACE and other adaptive methods
      such as Dynamic Cheatsheet may degrade, suggesting that context adaptation depends
      critically on feedback quality.\n\nReport issue for preceding element\n\n####
      Analysis.\n\nReport issue for preceding element\n\nAs shown in Table [2](https://arxiv.org/html/2510.04618v1#S4.T2
      \"Table 2 \u2023 4.4 Results on Domain-Specific Benchmark \u2023 4 Results \u2023
      Agentic Context Engineering: Evolving Contexts for Self-Improving Language Models\"),
      ACE delivers strong improvements on financial analysis benchmarks.\nIn the offline
      setting, when provided with ground-truth answers from the training split, ACE
      surpasses ICL, MIPROv2, and GEPA by clear margins (an average of 10.9%), showing
      that structured and evolving contexts are particularly effective when tasks
      require precise domain knowledge (e.g., financial concepts, XBRL rules) that
      goes beyond fixed demonstrations or monolithic optimized prompts.\nIn the online
      setting, ACE continues to exceed prior adaptive methods such as DC by an average
      of 6.2%, further confirming the benefit of agentic context engineering for accumulating
      reusable insights across specialized domains.\n\nReport issue for preceding
      element\n\nMoreover, we also observe that when ground-truth supervision or reliable
      execution signals are absent, both ACE and DC may degrade in performance.\nIn
      such cases, the constructed context can be polluted by spurious or misleading
      signals, highlighting a potential limitation of inference-time adaptation without
      reliable feedback.\nThis suggests that while ACE is robust under rich feedback
      (e.g., code execution results or formula correctness in agent tasks), its effectiveness
      depends on the availability of signals that allow the Reflector and Curator
      to make sound judgments.\nWe return to this limitation in Appendix [B](https://arxiv.org/html/2510.04618v1#A2
      \"Appendix B Limitations and Challenges \u2023 Agentic Context Engineering:
      Evolving Contexts for Self-Improving Language Models\").\n\nReport issue for
      preceding element\n\n### 4.5 Ablation Study\n\nReport issue for preceding element\n\nTable
      [3](https://arxiv.org/html/2510.04618v1#S4.T3 \"Table 3 \u2023 4.5 Ablation
      Study \u2023 4 Results \u2023 Agentic Context Engineering: Evolving Contexts
      for Self-Improving Language Models\") reports ablation studies on the AppWorld
      benchmark, analyzing how individual design choices of ACE contribute to effective
      context adaptation.\nWe examine three factors: (1) the Reflector with iterative
      refinement, our addition to the agentic framework beyond Dynamic Cheatsheet,
      (2) multi-epoch adaptation, which refines contexts over training samples multiple
      times, and (3) offline warmup, which initializes the context through offline
      adaptation before online adaptation begins.\n\nReport issue for preceding element\n\n|  |  |  |  |  |  |  |\n|
