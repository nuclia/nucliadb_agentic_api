      [References](https://arxiv.org/html/2510.04618#bib \"References\")\n\n[License:
      CC BY 4.0](https://info.arxiv.org/help/license/index.html#licenses-available)\n\narXiv:2510.04618v1
      [cs.LG] 06 Oct 2025\n\n# Agentic Context Engineering: Evolving Contexts for
      Self-Improving Language Models\n\nReport issue for preceding element\n\nQizheng
      Zhang 1\u2217\n\u2003Changran Hu 2\u2217\n\u2003Shubhangi Upasani 2\n\u2003Boyuan
      Ma 2\n\u2003Fenglu Hong 2\n  \nVamsidhar Kamanuru 2\n\u2003Jay Rainton 2\n\u2003Chen
      Wu 2\n\u2003Mengmeng Ji 2\n\u2003Hanchen Li 3\n  \nUrmish Thakker 2\n\u2003James
      Zou 1\n\u2003Kunle Olukotun 1\n  \n1 Stanford University \u20032 SambaNova Systems,
      Inc. \u20033 UC Berkeley \u2003\u2217 equal contribution\n  \n#\u2002qizhengz@stanford.edu,
      changran.hu@sambanovasystems.com\n\nReport issue for preceding element\n\n######
      Abstract\n\nReport issue for preceding element\n\nLarge language model (LLM)
      applications such as agents and domain-specific reasoning increasingly rely
      on *context adaptation*\u2014modifying inputs with instructions, strategies,
      or evidence, rather than weight updates.\nPrior approaches improve usability
      but often suffer from brevity bias, which drops domain insights for concise
      summaries, and from context collapse, where iterative rewriting erodes details
      over time.\nBuilding on the adaptive memory introduced by Dynamic Cheatsheet,
      we introduce ACE (Agentic Context Engineering), a framework that treats contexts
      as evolving playbooks that accumulate, refine, and organize strategies through
      a modular process of generation, reflection, and curation.\nACE prevents collapse
      with structured, incremental updates that preserve detailed knowledge and scale
      with long-context models.\nAcross agent and domain-specific benchmarks, ACE
      optimizes contexts both offline (e.g., system prompts) and online (e.g., agent
      memory), consistently outperforming strong baselines: +10.6% on agents and +8.6%
      on finance, while significantly reducing adaptation latency and rollout cost.\nNotably,
      ACE could adapt effectively without labeled supervision and instead by leveraging
      natural execution feedback.\nOn the AppWorld leaderboard, ACE matches the top-ranked
      production-level agent on the overall average and surpasses it on the harder
      test-challenge split, despite using a smaller open-source model.\nThese results
      show that comprehensive, evolving contexts enable scalable, efficient, and self-improving
      LLM systems with low overhead.\n\nReport issue for preceding element\n\n## 1
      Introduction\n\nReport issue for preceding element\nImage Refer to caption\n\nFigure
      1: Overall Performance Results. Our proposed framework, ACE, consistently outperforms
      strong baselines across agent and domain-specific reasoning tasks.\n\nReport
      issue for preceding element\n\nModern AI applications based on large language
      models (LLMs), such as LLM agents [[52](https://arxiv.org/html/2510.04618v1#bib.bib52),
      [49](https://arxiv.org/html/2510.04618v1#bib.bib49)] and compound AI systems
      [[55](https://arxiv.org/html/2510.04618v1#bib.bib55)], increasingly depend on
      context adaptation.\nInstead of modifying model weights, context adaptation
      improves performance after model training by incorporating clarified instructions,
      structured reasoning steps, or domain-specific input formats directly into the
      model\u2019s inputs.\nContexts underpin many AI system components, including
      system prompts that guide downstream tasks [[36](https://arxiv.org/html/2510.04618v1#bib.bib36),
      [4](https://arxiv.org/html/2510.04618v1#bib.bib4)], memory that carries past
      facts and experiences [[41](https://arxiv.org/html/2510.04618v1#bib.bib41),
      [48](https://arxiv.org/html/2510.04618v1#bib.bib48)], and factual evidence that
      reduces hallucination and supplements knowledge [[6](https://arxiv.org/html/2510.04618v1#bib.bib6)].\n\nReport
      issue for preceding element\n\nAdapting through contexts rather than weights
      offers several key advantages.\nContexts are interpretable and explainable for
      users and developers [[47](https://arxiv.org/html/2510.04618v1#bib.bib47), [45](https://arxiv.org/html/2510.04618v1#bib.bib45)],
      allow rapid integration of new knowledge at runtime [[27](https://arxiv.org/html/2510.04618v1#bib.bib27),
      [7](https://arxiv.org/html/2510.04618v1#bib.bib7)], and can be shared across
      models or modules in a compound system [[23](https://arxiv.org/html/2510.04618v1#bib.bib23)].\nMeanwhile,
      advances in long-context LLMs [[39](https://arxiv.org/html/2510.04618v1#bib.bib39)]
      and context-efficient inference such as KV cache reuse [[17](https://arxiv.org/html/2510.04618v1#bib.bib17),
      [51](https://arxiv.org/html/2510.04618v1#bib.bib51)] are making context-based
      approaches increasingly practical for deployment.\nAs a result, context adaptation
      is emerging as a central paradigm for building capable, scalable, and self-improving
      AI systems.\n\nReport issue for preceding element\n\nDespite this progress,
      existing approaches to context adaptation face two key limitations.\nFirst,
      a brevity bias: many prompt optimizers prioritize concise, broadly applicable
      instructions over comprehensive accumulation.\nFor example, GEPA [[4](https://arxiv.org/html/2510.04618v1#bib.bib4)]
      highlights brevity as a strength, but such abstraction can omit domain-specific
      heuristics, tool-use guidelines, or common failure modes that matter in practice
      [[16](https://arxiv.org/html/2510.04618v1#bib.bib16)].\nThis objective aligns
      with validation metrics in some settings, but often fails to capture the detailed
      strategies required by agents and knowledge-intensive applications.\nSecond,
      context collapse: methods that rely on monolithic rewriting by an LLM often
      degrade into shorter, less informative summaries over time, causing sharp performance
      declines (Figure [2](https://arxiv.org/html/2510.04618v1#S2.F2 \"Figure 2 \u2023
      The Brevity Bias. \u2023 2.2 Limitations of Existing Context Adaptation Methods
      \u2023 2 Background and Motivation \u2023 Agentic Context Engineering: Evolving
      Contexts for Self-Improving Language Models\")).\nIn domains such as interactive
      agents [[43](https://arxiv.org/html/2510.04618v1#bib.bib43), [38](https://arxiv.org/html/2510.04618v1#bib.bib38),
      [57](https://arxiv.org/html/2510.04618v1#bib.bib57)], domain-specific programming
      [[53](https://arxiv.org/html/2510.04618v1#bib.bib53), [56](https://arxiv.org/html/2510.04618v1#bib.bib56)],
      and financial or legal analysis [[33](https://arxiv.org/html/2510.04618v1#bib.bib33),
      [18](https://arxiv.org/html/2510.04618v1#bib.bib18), [44](https://arxiv.org/html/2510.04618v1#bib.bib44)],
      strong performance depends on retaining detailed, task-specific knowledge rather
      than compressing it away.\n\nReport issue for preceding element\n\nAs applications
      such as agents and knowledge-intensive reasoning demand greater reliability,
      recent work has shifted toward saturating contexts with abundant, potentially
      useful information [[22](https://arxiv.org/html/2510.04618v1#bib.bib22), [12](https://arxiv.org/html/2510.04618v1#bib.bib12),
      [11](https://arxiv.org/html/2510.04618v1#bib.bib11)], enabled by advances in
      long-context LLMs [[39](https://arxiv.org/html/2510.04618v1#bib.bib39), [34](https://arxiv.org/html/2510.04618v1#bib.bib34)].\nWe
      argue that contexts should function not as concise summaries, but as comprehensive,
      evolving playbooks\u2014detailed, inclusive, and rich with domain insights.\nUnlike
      humans, who often benefit from concise generalization, LLMs are more effective
      when provided with long, detailed contexts and can distill relevance autonomously
      [[22](https://arxiv.org/html/2510.04618v1#bib.bib22), [31](https://arxiv.org/html/2510.04618v1#bib.bib31),
      [41](https://arxiv.org/html/2510.04618v1#bib.bib41)].\nThus, instead of compressing
      away domain-specific heuristics and tactics, contexts should preserve them,
      allowing the model to decide what matters at inference time.\n\nReport issue
      for preceding element\n\nTo address these limitations, we introduce ACE (Agentic
      Context Engineering), a framework for comprehensive context adaptation in both
      offline settings (e.g., system prompt optimization) and online settings (e.g.,
      test-time memory adaptation).\nRather than compressing contexts into distilled
      summaries, ACE treats them as evolving playbooks that accumulate and organize
      strategies over time.\nBuilding on the agentic architecture of Dynamic Cheatsheet
      [[41](https://arxiv.org/html/2510.04618v1#bib.bib41)], ACE incorporates a modular
      workflow of generation, reflection, and curation, while adding structured, incremental
      updates guided by a grow-and-refine principle.\nThis design preserves detailed,
      domain-specific knowledge, prevents context collapse, and yields contexts that
      remain comprehensive and scalable throughout adaptation.\n\nReport issue for
      preceding element\n\nWe evaluate ACE on two categories of LLM applications that
      most benefit from comprehensive, evolving contexts:\n(1) *agents* [[43](https://arxiv.org/html/2510.04618v1#bib.bib43)],
      which require multi-turn reasoning, tool use, and environment interaction, where
      accumulated strategies can be reused across episodes; and\n(2) *domain-specific
      benchmarks*, which demand specialized tactics and knowledge, where we focus
      on financial analysis [[33](https://arxiv.org/html/2510.04618v1#bib.bib33),
      [44](https://arxiv.org/html/2510.04618v1#bib.bib44)].\nOur key findings are:\n\nReport
      issue for preceding element\n\n* \u2219\\bullet\n\n  ACE consistently outperforms
      strong baselines, yielding average gains of 10.6% on agents and 8.6% on domain-specific
      benchmarks, across both offline and online adaptation settings.\n\n  Report
      issue for preceding element\n* \u2219\\bullet\n\n  ACE is able to construct
      effective contexts without labeled supervision, instead leveraging execution
      feedback and environment signals\u2014key ingredients for self-improving LLMs
      and agents.\n\n  Report issue for preceding element\n* \u2219\\bullet\n\n  On
      the AppWorld benchmark leaderboard [[5](https://arxiv.org/html/2510.04618v1#bib.bib5)],
      ACE matches the top-ranked production-level agent IBM-CUGA [[35](https://arxiv.org/html/2510.04618v1#bib.bib35)]
      (powered by GPT-4.1) on average and surpasses it on the harder test-challenge
      split, while using a smaller open-source model (DeepSeek-V3.1).\n\n  Report
      issue for preceding element\n* \u2219\\bullet\n\n  ACE requires significantly
      fewer rollouts and lower dollar costs, and achieves 86.9% lower adaptation latency
      (on average) than existing adaptive methods, demonstrating that scalable self-improvement
      can be achieved with both higher accuracy and lower overhead.\n\n  Report issue
      for preceding element\n\n## 2 Background and Motivation\n\nReport issue for
      preceding element\n\n### 2.1 Context Adaptation\n\nReport issue for preceding
      element\n\nContext adaptation (or context engineering) refers to methods that
      improve model behavior by constructing or modifying inputs to an LLM, rather
      than altering its weights.\nThe current state of the art leverages natural language
      feedback [[40](https://arxiv.org/html/2510.04618v1#bib.bib40), [54](https://arxiv.org/html/2510.04618v1#bib.bib54),
      [4](https://arxiv.org/html/2510.04618v1#bib.bib4)].\nIn this paradigm, a language
      model inspects the current context along with signals such as execution traces,
      reasoning steps, or validation results, and generates natural language feedback
      on how the context should be revised.\nThis feedback is then incorporated into
      the context, enabling iterative adaptation.\nRepresentative methods include
      Reflexion [[40](https://arxiv.org/html/2510.04618v1#bib.bib40)], which reflects
      on failures to improve agent planning; TextGrad [[54](https://arxiv.org/html/2510.04618v1#bib.bib54)],
      which optimizes prompts via gradient-like textual feedback;\nGEPA [[4](https://arxiv.org/html/2510.04618v1#bib.bib4)],
      which refines prompts iteratively based on execution traces and achieves strong
      performance, even surpassing reinforcement learning approaches in some settings;\nand
      Dynamic Cheatsheet [[41](https://arxiv.org/html/2510.04618v1#bib.bib41)], which
      constructs an external memory that accumulates strategies and lessons from past
      successes and failures during inference.\nThese natural language feedback methods
      represent a major advance, offering flexible and interpretable signals for improving
      LLM systems beyond weight updates.\n\nReport issue for preceding element\n\n###
      2.2 Limitations of Existing Context Adaptation Methods\n\nReport issue for preceding
      element\n\n#### The Brevity Bias.\n\nReport issue for preceding element\n\nA
      recurring limitation of context adaptation methods is brevity bias: the tendency
      of optimization to collapse toward short, generic prompts.\nGao et al. [[16](https://arxiv.org/html/2510.04618v1#bib.bib16)]
      document this effect in prompt optimization for test generation, where iterative
      methods repeatedly produced near-identical instructions (e.g., \"Create unit
      tests to ensure methods behave as expected\"), sacrificing diversity and omitting
      domain-specific detail.\nThis convergence not only narrows the search space
      but also propagates recurring errors across iterations, since optimized prompts
      often inherit the same faults as their seeds.\nMore broadly, such bias undermines
      performance in domains that demand detailed, context-rich guidance\u2014such
      as multi-step agents, program synthesis, or knowledge-intensive reasoning\u2014where
      success hinges on accumulating rather than compressing task-specific insights.\n\nReport
      issue for preceding element\n\nImage Refer to caption\n\nFigure 2: Context Collapse.
      Monolithic rewriting of context by an LLM can collapse it into shorter, less
      informative summaries, leading to sharp performance drops.\n\nReport issue for
      preceding element\n\n#### Context Collapse.\n\nReport issue for preceding element\n\nIn
      a case study on the AppWorld benchmark [[43](https://arxiv.org/html/2510.04618v1#bib.bib43)],
      we observe a phenomenon we call context collapse, which arises when an LLM is
      tasked with fully rewriting the accumulated context at each adaptation step.\nAs
      the context grows large, the model tends to compress it into much shorter, less
      informative summaries, causing a dramatic loss of information.\nFor instance,
      at step 60 the context contained 18,282 tokens and achieved an accuracy of 66.7,
      but at the very next step it collapsed to just 122 tokens, with accuracy dropping
      to 57.1\u2014worse than the baseline accuracy of 63.7 without adaptation.\nWhile
      we highlight this through Dynamic Cheatsheet [[41](https://arxiv.org/html/2510.04618v1#bib.bib41)],
      the issue is not specific to that method; rather, it reflects a fundamental
      risk of end-to-end context rewriting with LLMs, where accumulated knowledge
      can be abruptly erased instead of preserved.\n\nReport issue for preceding element\n\nImage
      Refer to caption\n\nFigure 3: Example ACE-Generated Context on the AppWorld
      Benchmark (partially shown). ACE-generated contexts contain detailed, domain-specific
      insights along with tools and code that are readily usable, serving as a comprehensive
      playbook for LLM applications.\n\nReport issue for preceding element\n\n## 3
      Agentic Context Engineering (ACE)\n\nReport issue for preceding element\n\nWe
      present ACE (Agentic Context Engineering), a framework for scalable and efficient
      context adaptation in both offline (e.g., system prompt optimization) and online
      (e.g., test-time memory adaptation) scenarios.\nInstead of condensing knowledge
      into terse summaries or static instructions, ACE treats contexts as evolving
      playbooks that continuously accumulate, refine, and organize strategies over
      time.\nBuilding on the agentic design of Dynamic Cheatsheet [[41](https://arxiv.org/html/2510.04618v1#bib.bib41)],
      ACE introduces a structured division of labor across three roles (Figure [4](https://arxiv.org/html/2510.04618v1#S3.F4
      \"Figure 4 \u2023 3 Agentic Context Engineering (ACE) \u2023 Agentic Context
      Engineering: Evolving Contexts for Self-Improving Language Models\")): the *Generator*,
      which produces reasoning trajectories; the *Reflector*, which distills concrete
      insights from successes and errors; and the *Curator*, which integrates these
      insights into structured context updates.\nThis mirrors how humans learn\u2014experimenting,
      reflecting, and consolidating\u2014while avoiding the bottleneck of overloading
      a single model with all responsibilities.\n\nReport issue for preceding element\n\nTo
      address the limitations of prior methods discussed in \u00a7[2.2](https://arxiv.org/html/2510.04618v1#S2.SS2
      \"2.2 Limitations of Existing Context Adaptation Methods \u2023 2 Background
      and Motivation \u2023 Agentic Context Engineering: Evolving Contexts for Self-Improving
      Language Models\")\u2014notably brevity bias and context collapse\u2014ACE introduces
      three key innovations:\n(1) a dedicated Reflector that separates evaluation
      and insight extraction from curation, improving context quality and downstream
      performance (\u00a7[4.5](https://arxiv.org/html/2510.04618v1#S4.SS5 \"4.5 Ablation
      Study \u2023 4 Results \u2023 Agentic Context Engineering: Evolving Contexts
      for Self-Improving Language Models\"));\n(2) incremental *delta updates* (\u00a7[3.1](https://arxiv.org/html/2510.04618v1#S3.SS1
      \"3.1 Incremental Delta Updates \u2023 3 Agentic Context Engineering (ACE) \u2023
      Agentic Context Engineering: Evolving Contexts for Self-Improving Language Models\"))
      that replace costly monolithic rewrites with localized edits, reducing both
      latency and compute cost (\u00a7[4.6](https://arxiv.org/html/2510.04618v1#S4.SS6
      \"4.6 Cost and Speed Analysis \u2023 4 Results \u2023 Agentic Context Engineering:
      Evolving Contexts for Self-Improving Language Models\")); and\n(3) a *grow-and-refine*
      mechanism (\u00a7[3.2](https://arxiv.org/html/2510.04618v1#S3.SS2 \"3.2 Grow-and-Refine
      \u2023 3 Agentic Context Engineering (ACE) \u2023 Agentic Context Engineering:
      Evolving Contexts for Self-Improving Language Models\")) that balances steady
      context expansion with redundancy control.\n\nReport issue for preceding element\n\nImage
      Refer to caption\n\nFigure 4: The ACE Framework. Inspired by Dynamic Cheatsheet,
      ACE adopts an agentic architecture with three specialized components: a Generator,
      a Reflector, and a Curator.\n\nReport issue for preceding element\n\nAs shown
      in Figure [4](https://arxiv.org/html/2510.04618v1#S3.F4 \"Figure 4 \u2023 3
      Agentic Context Engineering (ACE) \u2023 Agentic Context Engineering: Evolving
      Contexts for Self-Improving Language Models\"), the workflow begins with the
      Generator producing reasoning trajectories for new queries, which surface both
      effective strategies and recurring pitfalls.\nThe Reflector critiques these
      traces to extract lessons, optionally refining them across multiple iterations.\nThe
      Curator then synthesizes these lessons into compact *delta entries*, which are
      merged deterministically into the existing context by lightweight, non-LLM logic.\nBecause
      updates are itemized and localized, multiple deltas can be merged in parallel,
      enabling batched adaptation at scale.\nACE further supports multi-epoch adaptation,
      where the same queries are revisited to progressively strengthen the context.\n\nReport
      issue for preceding element\n\n### 3.1 Incremental Delta Updates\n\nReport issue
      for preceding element\n\nA core design principle of ACE is to represent context
      as a collection of *structured, itemized bullets*, rather than a single monolithic
      prompt.\nThe concept of a bullet is similar to the concept of a memory entry
      in LLM memory frameworks like Dynamic Cheatsheet [[41](https://arxiv.org/html/2510.04618v1#bib.bib41)]
      and A-MEM [[48](https://arxiv.org/html/2510.04618v1#bib.bib48)], but builds
      on top of that and consists of (1) metadata, including a unique identifier and
      counters tracking how often it was marked helpful or harmful; and (2) content,
      capturing a small unit such as a reusable strategy, domain concept, or common
      failure mode.\nWhen solving new problems, the Generator highlights which bullets
      were useful or misleading, providing feedback that guides the Reflector in proposing
      corrective updates.\n\nReport issue for preceding element\n\nThis itemized design
      enables three key properties:\n(1) *localization*, so only the relevant bullets
      are updated;\n(2) *fine-grained retrieval*, so the Generator can focus on the
      most pertinent knowledge; and\n(3) *incremental adaptation*, allowing efficient
      merging, pruning, and de-duplication during inference.\n\nReport issue for preceding
      element\n\nRather than regenerating contexts in full, ACE incrementally produces
      compact *delta contexts*: small sets of candidate bullets distilled by the Reflector
      and integrated by the Curator.\nThis avoids the computational cost and latency
      of full rewrites, while ensuring that past knowledge is preserved and new insights
      are steadily appended.\nAs contexts grow, this approach provides the scalability
      needed for long-horizon or domain-intensive applications.\n\nReport issue for
      preceding element\n\n### 3.2 Grow-and-Refine\n\nReport issue for preceding element\n\nBeyond
      incremental growth, ACE ensures that contexts remain compact and relevant through
      periodic or lazy refinement.\nIn grow-and-refine, bullets with new identifiers
      are appended, while existing bullets are updated in place (e.g., incrementing
      counters).\nA de-duplication step then prunes redundancy by comparing bullets
      via semantic embeddings.\nThis refinement can be performed proactively (after
      each delta) or lazily (only when the context window is exceeded), depending
      on application requirements for latency and accuracy.\n\nReport issue for preceding
      element\n\nTogether, incremental updates and grow-and-refine maintain contexts
      that expand adaptively, remain interpretable, and avoid the potential variance
      introduced by monolithic context rewriting.\n\nReport issue for preceding element\n\n##
      4 Results\n\nReport issue for preceding element\n\nOur evaluation of ACE shows
      that:\n\nReport issue for preceding element\n\n* \u2219\\bullet\n\n  Enabling
      High-Performance, Self-Improving Agents. ACE enables agents to self-improve
      by dynamically refining their input context. It boosts accuracy on the AppWorld
      benchmark by up to 17.1% by learning to engineer better contexts from execution
      feedback alone, without needing ground-truth labels. This context-driven improvement
      allows a smaller, open-source model to match the performance of the top-ranked
      proprietary agent on the leaderboard. (\u00a7[4.3](https://arxiv.org/html/2510.04618v1#S4.SS3
      \"4.3 Results on Agent Benchmark \u2023 4 Results \u2023 Agentic Context Engineering:
      Evolving Contexts for Self-Improving Language Models\"))\n\n  Report issue for
      preceding element\n* \u2219\\bullet\n\n  Large Gains on Domain-Specific Benchmarks.
      On complex financial reasoning benchmarks, ACE delivers an average performance
      gain of 8.6% over strong baselines by constructing comprehensive playbooks with
      domain-specific concepts and insights. (\u00a7[4.4](https://arxiv.org/html/2510.04618v1#S4.SS4
      \"4.4 Results on Domain-Specific Benchmark \u2023 4 Results \u2023 Agentic Context
      Engineering: Evolving Contexts for Self-Improving Language Models\"))\n\n  Report
      issue for preceding element\n* \u2219\\bullet\n\n  Effective by Design. Ablation
      studies confirm our design choices are key to success, with components like
      the Reflector and multi-epoch refinement each contributing substantial performance
      gains. (\u00a7[4.5](https://arxiv.org/html/2510.04618v1#S4.SS5 \"4.5 Ablation
      Study \u2023 4 Results \u2023 Agentic Context Engineering: Evolving Contexts
      for Self-Improving Language Models\"))\n\n  Report issue for preceding element\n*
      \u2219\\bullet\n\n  Lower Cost and Adaptation Latency. ACE achieves these gains
      efficiently, reducing adaptation latency by 86.9% on average, while requiring
      fewer rollouts and lower token dollar costs. (\u00a7[4.6](https://arxiv.org/html/2510.04618v1#S4.SS6
      \"4.6 Cost and Speed Analysis \u2023 4 Results \u2023 Agentic Context Engineering:
      Evolving Contexts for Self-Improving Language Models\"))\n\n  Report issue for
      preceding element\n\n### 4.1 Tasks and Datasets\n\nReport issue for preceding
      element\n\nWe evaluate ACE on two categories of LLM applications that benefit
      most from a comprehensive and evolving context:\n(1) *agent benchmarks*, which
      require multi-turn reasoning, tool use, and environment interaction, where agents
      can accumulate and reuse strategies across episodes and environments; and\n(2)
      *domain-specific benchmarks*, which demand mastery of specialized concepts and
      tactics, where we focus on financial analysis as a case study.\n\nReport issue
      for preceding element\n\n* \u2219\\bullet\n\n  LLM Agent: AppWorld [[43](https://arxiv.org/html/2510.04618v1#bib.bib43)]
      is a suite of autonomous agent tasks involving API understanding, code generation,
      and environment interaction.\n  It provides a realistic execution environment
      with common applications and APIs (e.g., email, file system) and tasks of two
      difficulty levels (normal and challenge).\n  A public leaderboard [[5](https://arxiv.org/html/2510.04618v1#bib.bib5)]
      tracks performance, where, at the time of submission, the best system achieved
      only 60.3% average accuracy, highlighting the benchmark\u2019s difficulty and
      realism.\n\n  Report issue for preceding element\n* \u2219\\bullet\n\n  Financial
      Analysis: FiNER [[33](https://arxiv.org/html/2510.04618v1#bib.bib33)] and Formula
      [[44](https://arxiv.org/html/2510.04618v1#bib.bib44)] test LLMs on financial
      reasoning tasks that rely on the eXtensible Business Reporting Language (XBRL).\n  *FiNER*
      requires labeling tokens in XBRL financial documents with one of 139 fine-grained
      entity types, a key step for financial information extraction in regulated domains.\n  *Formula*
      focuses on extracting values from structured XBRL filings and performing computations
      to answer financial queries, i.e., numerical reasoning.\n\n  Report issue for
      preceding element\n\n#### Evaluation Metrics.\n\nReport issue for preceding
      element\n\nFor AppWorld, we follow the official benchmark protocol and report
      *Task Goal Completion* (TGC) and *Scenario Goal Completion* (SGC) on both the
      test-normal and test-challenge splits.\nFor FiNER and Formula, we follow the
      original setup and report accuracy, measured as the proportion of predicted
      answers that exactly match the ground truth.\n\nReport issue for preceding element\n\nAll
      datasets follow the original train/validation/test splits.\nFor *offline* context
      adaptation, methods are optimized on the training split and evaluated on the
      test split with pass@1 accuracy.\nFor *online* context adaptation, methods are
      evaluated sequentially on the test split: for each sample, the model first predicts
      with the current context, then updates its context based on that sample.\nThe
      same shuffled test split is used across all methods.\n\nReport issue for preceding
      element\n\n### 4.2 Baselines and Methods\n\nReport issue for preceding element\n\n####
      Base LLM.\n\nReport issue for preceding element\n\nThe base model is evaluated
      directly on each benchmark without any context engineering, using the default
      prompts provided by dataset authors.\nFor AppWorld, we follow the official ReAct
      [[52](https://arxiv.org/html/2510.04618v1#bib.bib52)] implementation released
      by the benchmark authors, and build all other baselines and methods on top of
      this framework.\n\nReport issue for preceding element\n\n#### In-Context Learning
      (ICL) [[3](https://arxiv.org/html/2510.04618v1#bib.bib3)].\n\nReport issue for
      preceding element\n\nICL provides the model with task demonstrations in the
      input prompt (few-shot or many-shot).\nThis allows the model to infer the task
      format and desired output without weight updates.\nWe supply all training samples
      when they fit within the model\u2019s context window; otherwise, we fill the
      window with as many demonstrations as possible.\n\nReport issue for preceding
      element\n\n#### MIPROv2 [[36](https://arxiv.org/html/2510.04618v1#bib.bib36)].\n\nReport
      issue for preceding element\n\nMIPROv2 is a popular prompt optimizer for LLM
      applications that works by jointly optimizing system instructions and in-context
      demonstrations via bayesian optimization.\nWe use the official DSPy implementation
      [[15](https://arxiv.org/html/2510.04618v1#bib.bib15)], setting `auto=\"heavy\"`
      to maximize optimization performance.\n\nReport issue for preceding element\n\n####
      GEPA [[4](https://arxiv.org/html/2510.04618v1#bib.bib4)].\n\nReport issue for
      preceding element\n\nGEPA (Genetic-Pareto) is a sample-efficient prompt optimizer
      based on reflective prompt evolution.\nIt collects execution traces (reasoning,
      tool calls, intermediate outputs) and applies natural-language reflection to
      diagnose errors, assign credit, and propose prompt updates.\nA genetic Pareto
      search maintains a frontier of high-performing prompts, mitigating local optima.\nEmpirically,
      GEPA outperforms reinforcement learning methods such as GRPO and prompt optimizers
      like MIPROv2, achieving up to 10\u201320% higher accuracy with as much as 35\u00d7
      fewer rollouts.\nWe use the official DSPy implementation [[14](https://arxiv.org/html/2510.04618v1#bib.bib14)],
      setting `auto=\"heavy\"` to maximize optimization performance.\n\nReport issue
      for preceding element\n\n#### Dynamic Cheatsheet (DC) [[41](https://arxiv.org/html/2510.04618v1#bib.bib41)].\n\nReport
      issue for preceding element\n\nDC is a test-time learning approach that introduces
      an adaptive external memory of reusable strategies and code snippets.\nBy continuously
      updating this memory with newly encountered inputs and outputs, DC enables models
      to accumulate knowledge and reuse it across tasks, often leading to substantial
      improvements over static prompting methods.\nA key advantage of DC is that it
      does not require ground-truth labels: the model can curate its own memory from
      its generations, making the method highly flexible and broadly applicable.\nWe
      use the official implementation released by the authors [[42](https://arxiv.org/html/2510.04618v1#bib.bib42)]
      and set it to use the cumulative mode (DC-CU).\n\nReport issue for preceding
      element\n\n#### ACE (ours).\n\nReport issue for preceding element\n\nACE optimizes
      LLM contexts for both offline and online adaptation through an agentic context
      engineering framework.\nTo ensure fairness, we use the same LLM for the Generator,
      Reflector, and Curator (non-thinking mode of DeepSeek-V3.1 [[13](https://arxiv.org/html/2510.04618v1#bib.bib13)]),
      preventing knowledge transfer from a stronger Reflector or Curator to a weaker
      Generator.\nThis isolates the benefit of context construction itself.\nWe adopt
      a batch size of 1 (constructing a delta context from each sample).\nWe set the
      maximum number of Reflector refinement rounds and the maximum number of epochs
      in offline adaptation to 5.\n\nReport issue for preceding element\n\n|  |  |  |  |  |  |  |\n|
