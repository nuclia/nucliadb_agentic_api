      |\n\nTable 1: Results on the AppWorld Agent Benchmark. \"GT labels\" indicates
      whether ground-truth labels are available to the Reflector during adaptation.
      We evaluate the ACE framework against multiple baselines on top of the official
      ReAct implementation, both for offline and online context adaptation.\nReAct
      + ACE outperforms selected baselines by an average of 10.6%, and could achieve
      good performance even without access to GT labels.\n\nReport issue for preceding
      element\n\n### 4.3 Results on Agent Benchmark\n\nReport issue for preceding
      element\n\n#### Analysis.\n\nReport issue for preceding element\n\nAs shown
      in Table [1](https://arxiv.org/html/2510.04618v1#S4.T1 \"Table 1 \u2023 ACE
      (ours). \u2023 4.2 Baselines and Methods \u2023 4 Results \u2023 Agentic Context
      Engineering: Evolving Contexts for Self-Improving Language Models\"), ACE consistently
      improves over strong baselines on the AppWorld benchmark.\nIn the offline setting,
      ReAct + ACE outperforms both ReAct + ICL and ReAct + GEPA by significant margins
      (12.3% and 11.9%, respectively), demonstrating that structured, evolving, and
      detailed contexts enable more effective agent learning than fixed demonstrations
      or single optimized instruction prompts.\nThese gains extend to the online setting,
      where ACE continues to outperform prior adaptive methods such as Dynamic Cheatsheet
      by an average of 7.6%.\n\nReport issue for preceding element\n\nIn the agent
      use case, ACE remains effective even without access to ground-truth labels during
      adaptation: ReAct + ACE achieves an average improvement of 14.8% over the ReAct
      baseline in this setting.\nThis robustness arises because ACE leverages signals
      naturally available during execution (e.g., code execution success or failure)
      to guide the Reflector and Curator in forming structured lessons of successes
      and failures.\nTogether, these results establish ACE as a strong and versatile
      framework for building self-improving agents that adapt reliably both with and
      without labeled supervision.\n\nReport issue for preceding element\n\nNotably,
      on the latest AppWorld leaderboard (as of September 20, 2025; Figure [5](https://arxiv.org/html/2510.04618v1#A3.F5
      \"Figure 5 \u2023 Appendix C AppWorld Leaderboard Snapshot (09/2025) \u2023
      Agentic Context Engineering: Evolving Contexts for Self-Improving Language Models\")),
      on average, ReAct + ACE (59.4%) matches the top-ranked IBM CUGA (60.3%), a production-level
      GPT-4.1\u2013based agent [[35](https://arxiv.org/html/2510.04618v1#bib.bib35)],
      despite using the smaller open-source model DeepSeek-V3.1.\nWith online adaptation,
      ReAct + ACE even surpasses IBM CUGA by 8.4% in TGC and 0.7% in SGC on the harder
      test-challenge split, underscoring the effectiveness of ACE in building comprehensive
      and self-evolving contexts for agents.\n\nReport issue for preceding element\n\n###
