      Zhu, Hengshu Zhu, Hui\n  Xiong, and Qing He.\n  A comprehensive survey on transfer
      learning.\n  arXiv:1911.02685, 2019.\n\n## Appendix A Related Work on Agent
      Memory\n\nReport issue for preceding element\n\nA growing body of work explores
      how agents can accumulate experience from past trajectories and leverage external
      (often non-parametric) memory to guide future actions.\nAgentFly [[59](https://arxiv.org/html/2510.04618v1#bib.bib59)]
      presents an extensible framework where memory evolves continuously as agents
      solve tasks, enabling scalable reinforcement learning and long-horizon reasoning
      across diverse environments.\nAWM (Agent Workflow Memory) [[46](https://arxiv.org/html/2510.04618v1#bib.bib46)]
      induces reusable *workflows*\u2014structured routines distilled from past trajectories\u2014and
      selectively injects them into memory to improve efficiency and generalization
      in web navigation benchmarks.\nA-MEM [[48](https://arxiv.org/html/2510.04618v1#bib.bib48)]
      introduces a dynamically organized memory system inspired by the Zettelkasten
      method: each stored memory is annotated with structured attributes (e.g., tags,
      keywords, contextual descriptions) and automatically linked to relevant past
      entries, while existing entries are updated to integrate new knowledge, yielding
      adaptive and context-aware retrieval.\nAgentic Plan Caching [[58](https://arxiv.org/html/2510.04618v1#bib.bib58)]
      instead focuses on cost efficiency by extracting reusable plan templates from
      agent trajectories and caching them for fast execution at test time.\n\nReport
      issue for preceding element\n\nTogether, these works demonstrate the value of
      external memory for improving adaptability, efficiency, and generalization in
      LLM agents.\nOur work differs by tackling the broader challenge of *context
      adaptation*, which spans not only agent memory but also system prompts, factual
      evidence, and other inputs underpinning AI systems.\nWe further highlight two
      fundamental limitations of existing adaptation methods\u2014brevity bias and
      context collapse\u2014and show that addressing them is essential for robustness,
      reliability, and scalability beyond raw task performance.\nAccordingly, our
      evaluation considers not only accuracy but also cost, latency, and scalability.\n\nReport
      issue for preceding element\n\n## Appendix B Limitations and Challenges\n\nReport
      issue for preceding element\n\nA potential limitation of ACE is its reliance
      on a reasonably strong Reflector: if the Reflector fails to extract meaningful
      insights from generated traces or outcomes, the constructed context may become
      noisy or even harmful.\nIn domain-specific tasks where no model can extract
      useful insights, the resulting context will naturally lack them. This dependency
      is similar to Dynamic Cheatsheet [[41](https://arxiv.org/html/2510.04618v1#bib.bib41)],
      where the quality of adaptation hinges on the underlying model\u2019s ability
      to curate memory.\nWe also note that not all applications require rich or detailed
      contexts.\nTasks like HotPotQA [[50](https://arxiv.org/html/2510.04618v1#bib.bib50)]
      often benefit more from concise, high-level instructions (e.g., how to retrieve
      and synthesize evidence) than from long contexts.\nSimilarly, games with fixed
      strategies such as Game of 24 [[41](https://arxiv.org/html/2510.04618v1#bib.bib41)]
      may only need a single reusable rule, rendering additional context redundant.\nOverall,
      ACE is most beneficial in settings that demand detailed domain knowledge, complex
      tool use, or environment-specific strategies that go beyond what is already
      embedded in model weights or simple system instructions.\n\nReport issue for
      preceding element\n\n## Appendix C AppWorld Leaderboard Snapshot (09/2025)\n\nReport
      issue for preceding element\nImage Refer to caption\n\nFigure 5: The AppWorld
      leaderboard as accessed on 09/20/2025.\n\nReport issue for preceding element\n\n##
      Appendix D Prompts\n\nReport issue for preceding element\n\nWe release the language
      model prompts used in our agentic context engineering framework as well as the
      baselines to support research transparency and reproducibility.\n\nReport issue
      for preceding element\n\nImage Refer to caption\n\nFigure 6: ICL-baseline Generator
      prompt on AppWorld\n\nReport issue for preceding element\nImage Refer to caption\n\nFigure
