apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nucliadb-agentic-api
  labels:
    app: nucliadb-agentic-api
    version: "{{ .Values.hash }}"
    chart: "{{ .Chart.Name }}"
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nucliadb-agentic-api
  minReplicas: {{.Values.api.minReplicas}}
  maxReplicas: {{.Values.api.maxReplicas}}
  metrics: {{- toYaml .Values.api.metrics | nindent 4}}
