[build-system]
requires = ["setuptools >= 64"]
build-backend = "setuptools.build_meta"

[project]

name = "nucliadb_agentic_api"
version = "1.0.0"
authors = [{ name = "AI Data Team", email = "learning@nuclia.com" }]
description = "NucliaDB Agentic API for Hyperforge"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "Apache-2.0"
dependencies = [
    "pydantic",
    "backoff",
    "nats-py",
    "nuclia>=4.9.25",
    "nuclia-models>=0.52.1",
    "nucliadb-models>=6.13.0.post6252",
    "nucliadb-protos",
    "nucliadb-sdk>=6.13.0.post6252",
    "nucliadb-telemetry",
    "nucliadb-utils",
    "hyperforge",
    "hyperforge_mcp",
    "hyperforge_nucliadb",
    "hyperforge_rephrase",
    "hyperforge_smart",
    "hyperforge_summarize",
    "hyperforge_google",
    "hyperforge_perplexity",
    "pydantic_settings",
    "mcp>=1.26.0",
    "prometheus_client",
    "mrflagly>=0.2.11",
    "aiodns",
    "httpx",
    "jinja2",
    "databases[asyncpg]",
    "sqlalchemy",
    "cryptography",
    "mmh3",
    "psycopg2",
    "tenacity",
    "websockets",
    "redis[hiredis]>=6.4.0",
    "types-redis>=4.6.0.20241004",
    "ruff>=0.15.10",
    "alembic>=1.18.4",
    "fastapi",
]


[tool.setuptools.packages.find]
where = ["src/"]


[project.urls]
"Progress" = "https://progress.com"
"Github" = "https://github.com/nuclia/forge"
"API Reference" = "https://docs.rag.progress.cloud"

[tool.pytest.ini_options]
asyncio_mode = "auto"


[project.scripts]
nucliadb-agentic-api = "nucliadb_agentic_api.commands:run"
nucliadb-agentic-api-extract-openapi = "nucliadb_agentic_api.commands:extract_openapi"


[dependency-groups]
dev = [
    # Linting
    "mypy-protobuf>=3.6.0",
    "mypy",
    "pre-commit",
    "ruff",
    # Testing
    "aioresponses",
    "faker>=25.1.0",
    "jsonschema",
    "pdbpp>=0.10.3",
    "pytest-asyncio>=0.23.0",
    "pytest-benchmark",
    "pytest-cov",
    "pytest-docker-fixtures[pg]>=1.4.2",
    "pytest-lazy-fixtures",
    "pytest-mock",
    "pytest-rerunfailures>=11.1.2",
    "pytest-shard",
    "pytest-xdist>=3.6.1",
    "pytest-recording",
    "pytest>=8.2.2,<9",
    "requests",
    "requests-mock>=1.12.1",
    "types-PyYAML>=6.0.12.20240808",
    "ty>=0.0.34",
    "sqlalchemy_utils",
    "inline_snapshot",
]
